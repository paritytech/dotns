[package]
name = "pop-rules"
version = "0.1.0"
authors = [ "[your_name] <[your_email]>" ]
edition = "2021"

[dependencies]
ink = { version = "6.0.0-beta.1", default-features = false, features = [
  "unstable-hostfn",
] }

[dev-dependencies]
ink-fuzzer = { path = "../../fuzzer/crates/ink-fuzzer" }
ink_e2e = { version = "6.0.0-beta.1" }
proptest = { version = "=1.9.0", features = [ "attr-macro" ] }

sp-api = { version = "38.0.0", default-features = false, features = [ "std" ] }
sp-core = { version = "38.1.0", default-features = false, features = [ "std" ] }
sp-genesis-builder = { version = "0.19.0", default-features = false, features = [ "std" ] }


[lib]
path = "lib.rs"

[features]
default = [ "std" ]
std = [ "ink/std" ]
ink-as-dependency = [  ]
e2e-tests = [  ]

[package.metadata.ink-lang]
abi = "ink"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [ 'cfg(ink_abi, values("ink", "sol", "all"))' ]

[profile.release]
panic = "abort"
