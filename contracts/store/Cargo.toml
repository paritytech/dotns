[package]
name = "dotns-store"
version = "0.1.0"
authors = [ "[your_name] <[your_email]>" ]
edition = "2021"

[dependencies]
ink = { version = "6.0.0-beta.1", default-features = false, features = [ "unstable-hostfn" ] }


[dev-dependencies]
ink-fuzzer = { path = "../../fuzzer/crates/ink-fuzzer" }
ink_e2e = { version = "6.0.0-beta.1" }

[lib]
path = "lib.rs"

[features]
default = [ "std" ]
std = [ "ink/std" ]
ink-as-dependency = [  ]
e2e-tests = [  ]

[profile.release]
panic = "abort"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [ 'cfg(ink_abi, values("ink", "sol", "all"))' ]
