name: Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["type: bug"]

body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Registration
        - Resolver
        - Store
        - Proof of Personhood
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Brief description of the bug and which contracts are affected.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      placeholder: |
        forge test --isolate --mt <testName>
        or link to a branch/commit
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Related contracts, dependencies, or screenshots.
    validations:
      required: false
