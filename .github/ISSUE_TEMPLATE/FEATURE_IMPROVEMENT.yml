name: Feature / Improvement
description: Propose a new feature or improvement
title: "[Feat]: "
labels: ["type: feature"]

body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Registration
        - Resolver
        - Store
        - Proof of Personhood
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: What problem does this solve? What is the desired outcome?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: Describe the change at a high level. Link designs or specs if available.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
