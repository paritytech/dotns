name: Deploy Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: chmod +x setup.bash
      - run: bun install

      - name: Start Anvil
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          anvil --chain-id 420420420 --port 8545 &
          sleep 3
          for i in {1..30}; do
            curl -s -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q "result" && exit 0
            sleep 2
          done
          exit 1

      - name: Deploy
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          bun run deploy:anvil > deploy.log 2>&1
          CODE=$?
          ARTIFACT="deployments/paseo-local/420420420.json"
          if [ $CODE -eq 0 ] && [ -f "$ARTIFACT" ]; then
            echo "result=All contracts deployed to Anvil" >> "$GITHUB_OUTPUT"
          else
            echo "result=Failed - Deployment error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-logs
          path: |
            deploy.log
            deployments/
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Deploy Contracts
          RESULT: ${{ steps.run.outputs.result }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let detailsSection = '';
            
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';
              if (parts[1]) detailsSection = `\n${detailsMarker}${parts[1]}`;
              
              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }
            }

            rows[section] = result;

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const body = `${marker}\n## CI Summary\n\n${table}${detailsSection}`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Stop Anvil
        if: always()
        run: pkill -f anvil || true