name: 4naly3er Analysis

on:
  pull_request:
    branches: [main, develop]
    paths: ['contracts/**', 'foundry.toml', 'remappings.txt']
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: 4naly3er-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge install && forge build --build-info

      - uses: actions/checkout@v4
        with:
          repository: Picodes/4naly3er
          path: .4naly3er

      - run: rm -f .4naly3er/src/issues/NC/uselessOverride.ts

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: .4naly3er/yarn.lock

      - working-directory: .4naly3er
        run: yarn install

      - name: Run 4naly3er
        continue-on-error: true
        run: |
          cd .4naly3er
          if [ -d "../contracts" ]; then
            yarn analyze "../contracts" "" "${{ github.server_url }}/${{ github.repository }}" || true
          fi

      - name: Generate report
        id: run
        run: |
          REPORT_PATH=".4naly3er/report.md"
          if [ ! -f "$REPORT_PATH" ]; then
            REPORT_PATH="report.md"
          fi
          if [ -f "$REPORT_PATH" ]; then
            python3 scripts/reports/4naly3er-report.py "$REPORT_PATH"
          else
            echo "result=Failed - No report generated" >> "$GITHUB_OUTPUT"
            echo "has_details=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set deploy path
        id: path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "target=4naly3er/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER}.github.io/${REPO_NAME}/4naly3er/pr-${PR_NUM}/4naly3er-report.html" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: steps.run.outputs.has_details == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          cp 4naly3er-report.html /tmp/deploy/
          bash scripts/shell/deploy-to-gh-pages.sh /tmp/deploy ${{ steps.path.outputs.target }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4naly3er-report
          path: |
            .4naly3er/report.md
            4naly3er-details.md
            4naly3er-report.html
          retention-days: 30

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: 4naly3er Analysis
          RESULT: ${{ steps.run.outputs.result }}
          HAS_DETAILS: ${{ steps.run.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          REPORT_URL: ${{ steps.path.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const rawResult = process.env.RESULT || 'Failed';
            const reportUrl = process.env.REPORT_URL;
            const result = hasDetails ? `${rawResult} - [View Report](${reportUrl})` : rawResult;
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('4naly3er-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === "github-actions[bot]" && c.body?.includes(marker));

            let rows = {};
            let existingDetails = {};
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              for (const line of (parts[0] || '').split('\n')) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match && match[1].trim() !== 'Check' && !match[1].trim().startsWith(':')) rows[match[1].trim()] = match[2].trim();
              }
              const re = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let m; while ((m = re.exec(existing.body)) !== null) existingDetails[m[1].trim()] = m[0];
            }

            rows[section] = result;
            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full report](${reportUrl}) | [View logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else { delete existingDetails[section]; }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Gas Report', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => (order.indexOf(a) === -1 ? 999 : order.indexOf(a)) - (order.indexOf(b) === -1 ? 999 : order.indexOf(b)));
            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) table += `| ${key} | ${rows[key]} |\n`;

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Gas Report', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => (detailsOrder.indexOf(a) === -1 ? 999 : detailsOrder.indexOf(a)) - (detailsOrder.indexOf(b) === -1 ? 999 : detailsOrder.indexOf(b)));
            let body = `${marker}\n## CI Summary\n\n${table}`;
            if (sortedDetails.length > 0) body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;

            // GitHub issue/PR comments are capped at 65536 characters. Fall back to
            // the summary table only when the cumulative body would overflow.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit. Follow the **View Report** links above for each section's full output._`;
            }

            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: |
          DIR="4naly3er/pr-${{ github.event.pull_request.number }}"
          [ -d "$DIR" ] || exit 0
          rm -rf "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up 4naly3er report for PR #${{ github.event.pull_request.number }}" || true
          git push
