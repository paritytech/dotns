name: 4naly3er Analysis

# SECURITY ATTENTION
# This workflow uses `pull_request_target` for the on-close cleanup job
# only. `pull_request_target` runs in the BASE branch's workflow context
# with repository secrets and a write-scoped GITHUB_TOKEN. The cleanup
# job is gated on `github.event.action == 'closed'` and does NOT check
# out PR-head code, so no untrusted code executes under that context.
#
# Adding other `pull_request_target` event types or any step that
# checks out PR-head code under that trigger would let a malicious PR
# exfiltrate repo secrets. Re-review carefully if widened.
on:
  pull_request:
    branches: [master, develop]
    paths: ['contracts/**', 'foundry.toml', 'remappings.txt']
  pull_request_target:
    types: [closed]

# Read-only by default. The analyze job runs a third-party tool, so it holds no write
# scope; the publish job, which runs no third-party code, gets the writes it needs.
permissions:
  contents: read

concurrency:
  group: 4naly3er-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.action != 'closed'
    outputs:
      result: ${{ steps.run.outputs.result }}
      has_details: ${{ steps.run.outputs.has_details }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup-foundry

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge install && forge build --build-info

      # Pinned to a commit: a branch or tag can move. Update it on purpose, after
      # reviewing the upstream diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Picodes/4naly3er
          ref: 8a9d1ebb7d362bc94f036fa9123d0977c6cb7436
          path: .4naly3er

      - run: rm -f .4naly3er/src/issues/NC/uselessOverride.ts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: .4naly3er/yarn.lock

      # The lockfile pins the dependency tree, and no dependency runs install scripts.
      - working-directory: .4naly3er
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run 4naly3er
        continue-on-error: true
        run: |
          cd .4naly3er
          if [ -d "../contracts" ]; then
            yarn analyze "../contracts" "" "${{ github.server_url }}/${{ github.repository }}" || true
          fi

      - name: Generate report
        id: run
        run: |
          REPORT_PATH=".4naly3er/report.md"
          if [ ! -f "$REPORT_PATH" ]; then
            REPORT_PATH="report.md"
          fi
          if [ -f "$REPORT_PATH" ]; then
            python3 scripts/reports/4naly3er-report.py "$REPORT_PATH"
          else
            echo "result=Failed - No report generated" >> "$GITHUB_OUTPUT"
            echo "has_details=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: 4naly3er-report
          path: |
            .4naly3er/report.md
            4naly3er-details.md
            4naly3er-report.html
          retention-days: 30

  # Publishes the report built by analyze. It checks out the base branch, so the
  # scripts that run with write scope are reviewed ones.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: analyze
    if: always() && github.event.action != 'closed' && needs.analyze.result != 'skipped'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.base_ref }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: 4naly3er-report

      - name: Set deploy path
        id: path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "target=4naly3er/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER}.github.io/${REPO_NAME}/4naly3er/pr-${PR_NUM}/4naly3er-report.html" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: needs.analyze.outputs.has_details == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          cp 4naly3er-report.html /tmp/deploy/
          bash scripts/shell/deploy-to-gh-pages.sh /tmp/deploy ${{ steps.path.outputs.target }}

      - name: Update PR comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          SECTION: 4naly3er Analysis
          RESULT: ${{ needs.analyze.outputs.result }}
          HAS_DETAILS: ${{ needs.analyze.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          REPORT_URL: ${{ steps.path.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const rawResult = process.env.RESULT || 'Failed';
            const reportUrl = process.env.REPORT_URL;
            const result = hasDetails ? `${rawResult} - [View Report](${reportUrl})` : rawResult;
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('4naly3er-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === "github-actions[bot]" && c.body?.includes(marker));

            let rows = {};
            let existingDetails = {};
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              for (const line of (parts[0] || '').split('\n')) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match && match[1].trim() !== 'Check' && !match[1].trim().startsWith(':')) rows[match[1].trim()] = match[2].trim();
              }
              const re = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let m; while ((m = re.exec(existing.body)) !== null) existingDetails[m[1].trim()] = m[0];
            }

            rows[section] = result;
            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full report](${reportUrl}) | [View logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else { delete existingDetails[section]; }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage', 'Documentation', 'Format & Lint', 'File Validation', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => (order.indexOf(a) === -1 ? 999 : order.indexOf(a)) - (order.indexOf(b) === -1 ? 999 : order.indexOf(b)));
            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) table += `| ${key} | ${rows[key]} |\n`;

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => (detailsOrder.indexOf(a) === -1 ? 999 : detailsOrder.indexOf(a)) - (detailsOrder.indexOf(b) === -1 ? 999 : detailsOrder.indexOf(b)));
            let body = `${marker}\n## CI Summary\n\n${table}`;
            if (sortedDetails.length > 0) body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;

            // GitHub issue/PR comments are capped at 65536 characters. Fall back to
            // the summary table only when the cumulative body would overflow.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit. Follow the **View Report** links above for each section's full output._`;
            }

            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.action == 'closed'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: |
          DIR="4naly3er/pr-${{ github.event.pull_request.number }}"
          [ -d "$DIR" ] || exit 0
          rm -rf "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up 4naly3er report for PR #${{ github.event.pull_request.number }}" || true
          git push
