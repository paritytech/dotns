name: File Validation

# Repo-wide counterpart to the pre-commit hook: the hook validates only the
# files a commit stages (for speed), so this job runs the same checks over every
# tracked file on a pull request, catching anything introduced with --no-verify
# or a hook-bypassing client. The checks themselves live in
# scripts/shell/validate-files.sh, shared with the hook so the two never drift.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: file-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: File Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tracked files
        continue-on-error: true
        run: |
          git ls-files -z | scripts/shell/validate-files.sh > validate.log 2>&1 \
            || echo "VALIDATION_FAILED=true" >> "$GITHUB_ENV"

      - name: Prepare result
        id: run
        if: always()
        run: |
          if [ "${VALIDATION_FAILED:-}" = "true" ]; then
            echo "result=Failed - File validation errors found" >> "$GITHUB_OUTPUT"
          else
            echo "result=Passed - All tracked files valid" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-validation-logs
          path: '*.log'
          retention-days: 7

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: File Validation
          RESULT: ${{ steps.run.outputs.result }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let detailsSection = '';

            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';
              if (parts[1]) detailsSection = `\n${detailsMarker}${parts[1]}`;

              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }
            }

            rows[section] = result;

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage', 'Documentation', 'Format & Lint', 'File Validation', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            let body = `${marker}\n## CI Summary\n\n${table}${detailsSection}`;

            // GitHub issue/PR comments are capped at 65536 characters. Fall back
            // to the summary table only when the cumulative body would overflow.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit._`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if validation failed
        if: env.VALIDATION_FAILED == 'true'
        run: exit 1
