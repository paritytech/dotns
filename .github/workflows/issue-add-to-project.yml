name: Add Issues to dotNS Project

on:
  issues:
    types: [opened]

# The action authenticates with PROJECT_PAT, so the workflow token needs no scope.
permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e # v1.0.2
        with:
          # Create a project at https://github.com/orgs/paritytech/projects/new
          # then paste the URL here, e.g. https://github.com/orgs/paritytech/projects/42
          project-url: ${{ vars.DOTNS_PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_PAT }}
