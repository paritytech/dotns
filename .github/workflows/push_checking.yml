name: Run Solidity Tests

# SECURITY ATTENTION
# This workflow uses `pull_request_target` for the on-close cleanup job
# only. `pull_request_target` runs in the BASE branch's workflow context
# with repository secrets and a write-scoped GITHUB_TOKEN. The cleanup
# job is gated on `github.event.action == 'closed'` and does NOT check
# out PR-head code, so no untrusted code executes under that context.
#
# Adding other `pull_request_target` event types (`opened`, `synchronize`,
# `reopened`, etc.) or any step that checks out `pull_request.head.sha`
# inside a `pull_request_target` job would let a malicious PR exfiltrate
# repo secrets. Re-review carefully if this trigger surface widens.
on:
  pull_request:
    branches: [master]
    paths: ["contracts/**", "test/**", "**.sol"]
  push:
    branches: [master]
    paths: ["contracts/**", "test/**", "**.sol"]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.action != 'closed'
    name: ${{ matrix.kind.label }}
    runs-on: parity-int-ubuntu-xl
    strategy:
      # Each matrix kind runs on its own runner so neither has to hold the
      # other's peak memory. Don't fail-fast: surfacing both shards' results
      # is more useful than aborting the slower one when the faster one fails.
      fail-fast: false
      matrix:
        kind:
          - id: unit-fuzz
            label: Contract Tests (Unit + Fuzz)
            forge_args: --no-match-contract Invariant --no-match-path 'test/fork/**'
          - id: invariant
            label: Contract Tests (Invariant)
            forge_args: --match-contract Invariant --no-match-path 'test/fork/**'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # Parity internal runners ship a minimal image; `oven-sh/setup-bun@v2`
      # extracts a zip archive at install time and needs `unzip` on PATH.
      - name: Install unzip (required by oven-sh/setup-bun on parity-int-* images)
        run: sudo apt-get update && sudo apt-get install -y unzip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"

      # `openzeppelin-foundry-upgrades` shells out to `npx @openzeppelin/upgrades-core`
      # via `vm.ffi` during tests; bun does not provide `npx`, so install Node here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: bun install

      # Only the unit-fuzz job needs the fork adapter, and only when fork tests
      # actually exist in the tree. Fork tests are PR-scoped, so `test/fork/` is
      # empty on master and `hashFiles` returns '' (step skipped, no docker build).
      - name: Start revive-eth-rpc (paseo_local fork target)
        if: matrix.kind.id == 'unit-fuzz' && hashFiles('test/fork/**') != ''
        run: |
          docker compose up -d --build
          bash scripts/shell/wait-for-eth-rpc.sh

      - name: Run tests
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
          FOUNDRY_PROFILE: "ci"
          FOUNDRY_FUZZ_GAS_REPORT_SAMPLES: "1000"
          FOUNDRY_INVARIANT_GAS_REPORT_SAMPLES: "1000"
        run: |
          set +e
          # Remove any prior build-info before `forge build` so the JSON the OZ
          # validator (vm.ffi inside upgrade tests) reads is the complete one
          # this build emits. Defence-in-depth: on a fresh `ubuntu-latest`
          # runner there is no prior `out/`, but if a future change reuses a
          # warm cache (self-hosted runner, docker layer, etc.) a partial
          # build-info from another solc invocation would otherwise survive.
          # Preserving `cache/` keeps incremental compile fast.
          rm -rf out/build-info
          forge build --sizes > build.log 2>&1
          BUILD=$?

          if [ $BUILD -ne 0 ]; then
            echo "result=Failed - Build error" >> "$GITHUB_OUTPUT"
            echo "has_details=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          forge test -vv --summary ${{ matrix.kind.forge_args }} 2>&1 | tee test.log
          TEST=${PIPESTATUS[0]}

          python3 scripts/reports/test-report.py test.log

          if [ $TEST -ne 0 ]; then
            exit 1
          fi

      # Fork tests run against the revive-eth-rpc adapter started above, only
      # when present. The preceding `forge build` already produced full build-info
      # for the OZ upgrade validator, so this reuses it.
      - name: Run fork tests
        if: matrix.kind.id == 'unit-fuzz' && hashFiles('test/fork/**') != ''
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
          FOUNDRY_PROFILE: "ci"
        run: forge test -vv --match-path 'test/fork/**'

      - name: Tear down revive-eth-rpc
        if: always() && matrix.kind.id == 'unit-fuzz' && hashFiles('test/fork/**') != ''
        run: docker compose down --volumes --remove-orphans

      - name: Stage matrix-kind output for the aggregator
        if: always()
        run: |
          mkdir -p shard
          # `result.txt` is the contract between this matrix job and the
          # report aggregator: one line of `label|result|has_details` so the
          # aggregator can rebuild the PR-comment table without re-running
          # `test-report.py` or shelling into the test logs.
          printf '%s|%s|%s\n' \
            "${{ matrix.kind.label }}" \
            "${{ steps.run.outputs.result || 'Failed' }}" \
            "${{ steps.run.outputs.has_details || 'false' }}" \
            > shard/result.txt
          for f in test.log build.log test-details.md test-report.html; do
            [ -f "$f" ] && cp "$f" "shard/$f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-shard-${{ matrix.kind.id }}
          path: shard
          retention-days: 7

      - if: steps.run.outputs.result && contains(steps.run.outputs.result, 'Failed')
        run: exit 1

  report:
    name: Report Test Results
    needs: test
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: test-artifacts
          pattern: test-shard-*

      - name: Set deploy paths
        id: path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "target_base=tests/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "url_base=https://${OWNER}.github.io/${REPO_NAME}/tests/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"

      - name: Deploy per-shard reports to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          # Each shard's `test-report.html` lands under its kind subdir
          # (e.g. tests/pr-123/unit-fuzz/test-report.html) so the two
          # parallel uploads cannot stomp each other on gh-pages.
          for shard_dir in test-artifacts/test-shard-*/; do
            kind="$(basename "$shard_dir" | sed 's/^test-shard-//')"
            if [ -f "${shard_dir}test-report.html" ]; then
              mkdir -p "/tmp/deploy/${kind}"
              cp "${shard_dir}test-report.html" "/tmp/deploy/${kind}/"
            fi
          done
          if [ -n "$(ls -A /tmp/deploy 2>/dev/null)" ]; then
            bash scripts/shell/deploy-to-gh-pages.sh /tmp/deploy "${{ steps.path.outputs.target_base }}"
          fi

      - name: Update PR comment
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          URL_BASE: ${{ steps.path.outputs.url_base }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;
            const urlBase = process.env.URL_BASE;

            // Read every shard's `result.txt` into a list of sections.
            // Each entry = { id, label, result, hasDetails, details, reportUrl }
            const artifactsRoot = 'test-artifacts';
            const shardEntries = [];
            for (const dirent of fs.readdirSync(artifactsRoot, { withFileTypes: true })) {
              if (!dirent.isDirectory() || !dirent.name.startsWith('test-shard-')) continue;
              const id = dirent.name.replace(/^test-shard-/, '');
              const shardPath = path.join(artifactsRoot, dirent.name);
              const resultLine = fs.readFileSync(path.join(shardPath, 'result.txt'), 'utf8').trim();
              const [label, result, hasDetailsRaw] = resultLine.split('|');
              const hasDetails = hasDetailsRaw === 'true';
              let details = '';
              try { details = fs.readFileSync(path.join(shardPath, 'test-details.md'), 'utf8').trim(); } catch {}
              const reportUrl = hasDetails ? `${urlBase}/${id}/test-report.html` : null;
              shardEntries.push({ id, label, result, hasDetails, details, reportUrl });
            }

            // Read existing comment, parse rows + details, then overwrite
            // every row this workflow owns. Other workflows' rows survive.
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === "github-actions[bot]" && c.body?.includes(marker));

            let rows = {};
            let existingDetails = {};
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              for (const line of (parts[0] || '').split('\n')) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match && match[1].trim() !== 'Check' && !match[1].trim().startsWith(':')) rows[match[1].trim()] = match[2].trim();
              }
              const re = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let m; while ((m = re.exec(existing.body)) !== null) existingDetails[m[1].trim()] = m[0];
            }

            for (const entry of shardEntries) {
              const result = entry.hasDetails && entry.reportUrl ? `${entry.result} - [View Report](${entry.reportUrl})` : entry.result;
              rows[entry.label] = result;
              if (entry.hasDetails && entry.details) {
                const reportLink = entry.reportUrl ? `[View full report](${entry.reportUrl}) | ` : '';
                existingDetails[entry.label] = `<details>\n<summary><strong>${entry.label}</strong></summary>\n\n${entry.details}\n\n${reportLink}[View logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
              } else {
                delete existingDetails[entry.label];
              }
            }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => (order.indexOf(a) === -1 ? 999 : order.indexOf(a)) - (order.indexOf(b) === -1 ? 999 : order.indexOf(b)));
            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) table += `| ${key} | ${rows[key]} |\n`;

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => (detailsOrder.indexOf(a) === -1 ? 999 : detailsOrder.indexOf(a)) - (detailsOrder.indexOf(b) === -1 ? 999 : detailsOrder.indexOf(b)));
            let body = `${marker}\n## CI Summary\n\n${table}`;
            if (sortedDetails.length > 0) body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;

            // GitHub issue/PR comments are capped at 65536 characters. Fall back to
            // the summary table only when the cumulative body would overflow; per-
            // section reports remain reachable via the `[View Report]` row links.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit. Follow the **View Report** links above for each section's full output._`;
            }

            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: |
          DIR="tests/pr-${{ github.event.pull_request.number }}"
          [ -d "$DIR" ] || exit 0
          rm -rf "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up test report for PR #${{ github.event.pull_request.number }}" || true
          git push
