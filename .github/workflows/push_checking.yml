name: Contract Tests

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']
  push:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
      - run: bun install

      - name: Run tests
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          forge build --sizes > build.log 2>&1
          BUILD=$?
          
          if [ $BUILD -ne 0 ]; then
            echo "result=Failed - Build error" >> "$GITHUB_OUTPUT"
            echo "has_details=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          # Run tests with summary for better parsing
          forge test -vv --summary 2>&1 | tee test.log
          TEST=${PIPESTATUS[0]}

          # Process results
          python3 << 'EOF'
          import re
          import os
          from collections import defaultdict

          out = lambda k,v: open(os.environ['GITHUB_OUTPUT'], 'a').write(f"{k}={v}\n")

          with open('test.log', 'r') as f:
              content = f.read()

          # Parse by contract
          contracts = defaultdict(lambda: {'passed': [], 'failed': []})
          current_contract = None

          for line in content.split('\n'):
              # Match contract header like "Ran 5 tests for test/Registry.t.sol:RegistryTest"
              contract_match = re.search(r'for test/([^:]+):(\w+)', line)
              if contract_match:
                  current_contract = contract_match.group(2)
              
              # Match test results
              pass_match = re.match(r'\[PASS\]\s+(\w+)\(\)\s*(?:\(gas:\s*(\d+)\))?', line)
              fail_match = re.match(r'\[FAIL[:\.]?\s*[^\]]*\]\s+(\w+)\(\)', line)
              
              if pass_match and current_contract:
                  contracts[current_contract]['passed'].append({
                      'name': pass_match.group(1),
                      'gas': pass_match.group(2) or ''
                  })
              elif fail_match and current_contract:
                  contracts[current_contract]['failed'].append({
                      'name': fail_match.group(1)
                  })

          total_passed = sum(len(c['passed']) for c in contracts.values())
          total_failed = sum(len(c['failed']) for c in contracts.values())
          total = total_passed + total_failed

          if total_failed > 0:
              out('result', f'Failed - {total_failed} of {total} tests failed')
              out('has_details', 'true')
          elif total > 0:
              out('result', 'All tests passed')
              out('has_details', 'true')
          else:
              out('result', 'No tests found')
              out('has_details', 'false')

          # Build markdown grouped by contract
          md = []
          
          # Failed tests first
          for contract, data in sorted(contracts.items()):
              if data['failed']:
                  md.append(f"\n**{contract} - Failed ({len(data['failed'])})**\n")
                  md.append("| Test |")
                  md.append("|:-----|")
                  for t in data['failed'][:10]:
                      md.append(f"| {t['name']}() |")
                  if len(data['failed']) > 10:
                      md.append(f"| +{len(data['failed'])-10} more |")

          # Passed tests grouped by contract
          for contract, data in sorted(contracts.items()):
              if data['passed']:
                  md.append(f"\n**{contract} ({len(data['passed'])} passed)**\n")
                  md.append("| Test | Gas |")
                  md.append("|:-----|----:|")
                  for t in data['passed'][:10]:
                      md.append(f"| {t['name']}() | {t['gas']} |")
                  if len(data['passed']) > 10:
                      md.append(f"| +{len(data['passed'])-10} more | |")

          with open('test-details.md', 'w') as f:
              f.write('\n'.join(md))
          EOF

          if [ $TEST -ne 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            *.log
            test-details.md
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Contract Tests
          RESULT: ${{ steps.run.outputs.result }}
          HAS_DETAILS: ${{ steps.run.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('test-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};
            
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';
              
              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }
              
              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            rows[section] = result;

            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;
            
            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }