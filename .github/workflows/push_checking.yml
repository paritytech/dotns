name: Run Solidity Tests

on:
  pull_request:
    branches: [main]
    paths: ["contracts/**", "test/**", "**.sol"]
  push:
    branches: [main]
    paths: ["contracts/**", "test/**", "**.sol"]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: parity-int-ubuntu-xl
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # Parity internal runners ship a minimal image; `oven-sh/setup-bun@v2`
      # extracts a zip archive at install time and needs `unzip` on PATH.
      - name: Install unzip (required by oven-sh/setup-bun on parity-int-* images)
        run: sudo apt-get update && sudo apt-get install -y unzip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"

      # `openzeppelin-foundry-upgrades` shells out to `npx @openzeppelin/upgrades-core`
      # via `vm.ffi` during tests; bun does not provide `npx`, so install Node here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bun install

      - name: Start revive-eth-rpc (paseo_local fork target)
        run: |
          docker compose up -d --build
          bash scripts/shell/wait-for-eth-rpc.sh

      - name: Run tests
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
          FOUNDRY_PROFILE: "ci"
          FOUNDRY_FUZZ_GAS_REPORT_SAMPLES: "1000"
          FOUNDRY_INVARIANT_GAS_REPORT_SAMPLES: "1000"
        run: |
          set +e
          # Remove any prior build-info before `forge build` so the JSON the OZ
          # validator (vm.ffi inside upgrade tests) reads is the complete one
          # this build emits. Defence-in-depth: on a fresh `ubuntu-latest`
          # runner there is no prior `out/`, but if a future change reuses a
          # warm cache (self-hosted runner, docker layer, etc.) a partial
          # build-info from another solc invocation would otherwise survive.
          # Preserving `cache/` keeps incremental compile fast.
          rm -rf out/build-info
          forge build --sizes > build.log 2>&1
          BUILD=$?

          if [ $BUILD -ne 0 ]; then
            echo "result=Failed - Build error" >> "$GITHUB_OUTPUT"
            echo "has_details=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          forge test -vv --summary 2>&1 | tee test.log
          TEST=${PIPESTATUS[0]}

          python3 scripts/reports/test-report.py test.log

          if [ $TEST -ne 0 ]; then
            exit 1
          fi

      - name: Tear down revive-eth-rpc
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Set deploy path
        id: path
        if: github.event_name == 'pull_request'
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "target=tests/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER}.github.io/${REPO_NAME}/tests/pr-${PR_NUM}/test-report.html" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: github.event_name == 'pull_request' && steps.run.outputs.has_details == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          cp test-report.html /tmp/deploy/
          bash scripts/shell/deploy-to-gh-pages.sh /tmp/deploy ${{ steps.path.outputs.target }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            *.log
            test-details.md
            test-report.html
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Contract Tests
          RESULT: ${{ steps.run.outputs.result }}
          HAS_DETAILS: ${{ steps.run.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          REPORT_URL: ${{ steps.path.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const rawResult = process.env.RESULT || 'Failed';
            const reportUrl = process.env.REPORT_URL;
            const result = hasDetails && reportUrl ? `${rawResult} - [View Report](${reportUrl})` : rawResult;
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('test-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === "github-actions[bot]" && c.body?.includes(marker));

            let rows = {};
            let existingDetails = {};
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              for (const line of (parts[0] || '').split('\n')) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match && match[1].trim() !== 'Check' && !match[1].trim().startsWith(':')) rows[match[1].trim()] = match[2].trim();
              }
              const re = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let m; while ((m = re.exec(existing.body)) !== null) existingDetails[m[1].trim()] = m[0];
            }

            rows[section] = result;
            if (hasDetails && details) {
              const reportLink = reportUrl ? `[View full report](${reportUrl}) | ` : '';
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n${reportLink}[View logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else { delete existingDetails[section]; }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Gas Report', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => (order.indexOf(a) === -1 ? 999 : order.indexOf(a)) - (order.indexOf(b) === -1 ? 999 : order.indexOf(b)));
            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) table += `| ${key} | ${rows[key]} |\n`;

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Gas Report', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => (detailsOrder.indexOf(a) === -1 ? 999 : detailsOrder.indexOf(a)) - (detailsOrder.indexOf(b) === -1 ? 999 : detailsOrder.indexOf(b)));
            let body = `${marker}\n## CI Summary\n\n${table}`;
            if (sortedDetails.length > 0) body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;

            // GitHub issue/PR comments are capped at 65536 characters. Fall back to
            // the summary table only when the cumulative body would overflow; per-
            // section reports remain reachable via the `[View Report]` row links.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit. Follow the **View Report** links above for each section's full output._`;
            }

            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - if: steps.run.outputs.result && contains(steps.run.outputs.result, 'Failed')
        run: exit 1

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: |
          DIR="tests/pr-${{ github.event.pull_request.number }}"
          [ -d "$DIR" ] || exit 0
          rm -rf "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up test report for PR #${{ github.event.pull_request.number }}" || true
          git push
