name: Format & Lint

on:
  pull_request:
    paths: ['src/**', 'script/**', 'test/**', '**.sol']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      - name: Check formatting
        id: format
        continue-on-error: true
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge fmt --check > format.log 2>&1 || echo "FORMAT_FAILED=true" >> $GITHUB_ENV

      - name: Build contracts
        id: build
        continue-on-error: true
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge build --sizes > build.log 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Prepare result
        id: run
        if: always()
        run: |
          if [ "${FORMAT_FAILED:-}" = "true" ] && [ "${BUILD_FAILED:-}" = "true" ]; then
            echo "result=Failed - Formatting and build errors" >> "$GITHUB_OUTPUT"
          elif [ "${FORMAT_FAILED:-}" = "true" ]; then
            echo "result=Failed - Formatting errors found" >> "$GITHUB_OUTPUT"
          elif [ "${BUILD_FAILED:-}" = "true" ]; then
            echo "result=Failed - Build errors" >> "$GITHUB_OUTPUT"
          else
            echo "result=Passed - Code formatted correctly" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-logs
          path: '*.log'
          retention-days: 7

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Format & Lint
          RESULT: ${{ steps.run.outputs.result }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let detailsSection = '';
            
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';
              if (parts[1]) detailsSection = `\n${detailsMarker}${parts[1]}`;
              
              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }
            }

            rows[section] = result;

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            let body = `${marker}\n## CI Summary\n\n${table}${detailsSection}`;

            // GitHub issue/PR comments are capped at 65536 characters. Fall back
            // to the summary table only when the cumulative body would overflow.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit. Follow the **View Report** links above for each section's full output._`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if checks failed
        if: env.FORMAT_FAILED == 'true' || env.BUILD_FAILED == 'true'
        run: exit 1