name: Publish Release Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"

      - run: bun install

      - name: Build contracts
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge build --sizes

      - name: Run tests
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge test -vv

      - name: Extract ABIs
        run: |
          mkdir -p release/abis

          contracts=(
            "StoreFactory"
            "Store"
            "DotnsRegistrar"
            "DotnsReverseResolver"
            "DotnsRegistry"
            "DotnsContentResolver"
            "DotnsResolver"
            "PopRules"
            "DotnsRegistrarController"
            "DotnsProtocolRegistry"
            "DotnsNameEscrow"
            "DotnsPopController"
            "DotnsPopResolver"
            "IStore"
            "IStoreFactory"
            "IDotnsRegistrar"
            "IDotnsRegistrarController"
            "IDotnsRegistry"
            "IDotnsReverseResolver"
            "IDotnsContentResolver"
            "IDotnsResolver"
            "IPopRules"
            "IDotnsProtocolRegistry"
            "IDotnsNameEscrow"
            "IDotnsPopController"
            "IDotnsPopResolver"
          )

          for name in "${contracts[@]}"; do
            abi_file="out/${name}.sol/${name}.json"
            if [ -f "$abi_file" ]; then
              jq '.abi' "$abi_file" > "release/abis/${name}.json"
              echo "Extracted ${name}"
            else
              echo "Error: ${abi_file} not found"
              exit 1
            fi
          done

      - name: Package release artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd release
          zip -r "../dotns-abis-${TAG}.zip" abis/

      - name: Generate release body
        run: |
          TAG="${GITHUB_REF_NAME}"

          cat > release-body.md << 'ENDOFBODY'
          ## DotNS ABI Package

          **Contracts**
          | Contract | ABI |
          |----------|-----|
          ENDOFBODY

          for f in release/abis/*.json; do
            name=$(basename "$f" .json)
            echo "          | \`${name}\` | [${name}.json](dotns-abis-${TAG}.zip) |" >> release-body.md
          done

          cat >> release-body.md << 'ENDOFBODY'

          ### Download

          - **All ABIs (zip):** `dotns-abis-${TAG}.zip`
          - **Individual ABIs:** Each contract ABI is also attached as a separate artifact

          ### Usage

          ```ts
          import StoreAbi from "./abis/Store.json";
          import RegistrarAbi from "./abis/DotnsRegistrar.json";
          ```
          ENDOFBODY

          sed -i 's/^          //' release-body.md

      - name: Create release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dotns-abis-*.zip
            release/abis/*.json
          body_path: release-body.md
          draft: true
          prerelease: false
          generate_release_notes: true
