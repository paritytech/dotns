name: Publish Release Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.5.5. The tag is created from the selected branch."
        required: true
        type: string

permissions:
  contents: write

# Two runs for the same version would race to attach assets to the same draft. On a
# dispatch `github.ref_name` is the branch, so key on the requested version instead.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Baked into the genesis registry, so it decides which networks the artifact suits.
    # Job-level: five steps name the file derived from it and must not disagree.
    env:
      DOTNS_TLD: testnet
    steps:
      # On workflow_dispatch the tag does not exist yet; the release step creates it
      # from the branch this run was started on. Read through an env var rather than
      # interpolating the input into the script.
      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3, got '$TAG'."
            exit 1
          fi
          # A release created for an existing tag is cut at that tag's commit: GitHub
          # ignores target_commitish when the tag is already there. The ABIs would come
          # from this branch while the release pointed somewhere else.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; use a different version."
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG from $GITHUB_REF_NAME."

      - name: Reject a pre-published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          if state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/gh-err.txt"); then
            if [ "$state" = "false" ]; then
              echo "::error::Release $TAG is already published; use a different version."
              exit 1
            fi
            echo "$TAG exists as a draft; assets can still be attached."
          elif grep -qi "release not found" "$RUNNER_TEMP/gh-err.txt"; then
            echo "No release for $TAG yet."
          else
            echo "::error::Could not read the state of release $TAG; refusing to continue."
            cat "$RUNNER_TEMP/gh-err.txt"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
          no-cache: true

      # `openzeppelin-foundry-upgrades` shells out to `npx @openzeppelin/upgrades-core`
      # via `vm.ffi` during tests; bun does not provide `npx`, so install Node here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: bun install

      - name: Build contracts
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        # Remove any prior build-info so the OZ validator (vm.ffi inside
        # upgrade tests in the next step) reads the complete artefact this
        # build emits. Preserving `cache/` keeps incremental compile fast.
        run: rm -rf out/build-info && forge build --sizes

      - name: Run tests
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge test -vv

      # pallet-revive genesis, so a chain can carry DotNS from block zero rather than
      # deploying it afterwards. Built here rather than downstream: this repo owns the
      # contracts, the deploy scripts and the CREATE3 factory key that fixes every address,
      # and the artifact then ships from the same commit as the ABIs beside it.
      #
      # The owner key is taken from DOTNS_ADMIN_KEY if set, otherwise derived from
      # DOTNS_ADMIN_MNEMONIC. It ends up owning the registry, resolvers, registrar, store factory
      # and beacons in the genesis storage, so the script refuses to run without one.
      - name: Build pallet-revive genesis
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
          FACTORY_DEPLOYER_KEY: ${{ secrets.FACTORY_DEPLOYER_KEY }}
          DOTNS_ADMIN_KEY: ${{ secrets.DOTNS_ADMIN_KEY }}
          DOTNS_ADMIN_MNEMONIC: ${{ secrets.DOTNS_ADMIN_MNEMONIC }}
        run: bash scripts/genesis/build-genesis.sh release

      - name: Extract ABIs
        run: |
          mkdir -p release/abis

          # read trims stray spaces and tabs on its own. A carriage return, from a list
          # saved with CRLF line endings, it does not: that would end up inside the
          # artifact path below, so strip it explicitly.
          while read -r name || [ -n "$name" ]; do
            name="${name%$'\r'}"
            case "$name" in '' | '#'*) continue ;; esac
            abi_file="out/${name}.sol/${name}.json"
            if [ ! -f "$abi_file" ]; then
              echo "::error::${abi_file} not found; check .github/abi-contracts.txt"
              exit 1
            fi
            jq '.abi' "$abi_file" > "release/abis/${name}.json"
            echo "Extracted ${name}"
          done < .github/abi-contracts.txt

          # Record what the build actually produced, so the post-upload check compares
          # against it rather than against a second hand-maintained list.
          find release/abis -maxdepth 1 -type f -printf '%f\n' | sort > release/expected-assets.txt
          echo "Extracted $(wc -l < release/expected-assets.txt) ABIs"

      # Addresses come from the committed deployment manifests, the same files the
      # deployment pipeline in dotns-releases measures a live deploy against. A consumer
      # that only has the release needs them to reach any contract at all.
      - name: Generate deployments and release manifest
        run: bun scripts/js/release-metadata.mjs build --tag "$RELEASE_TAG" --out release

      - name: Package release artifacts
        run: |
          TAG="$RELEASE_TAG"
          cd release
          zip -r "../dotns-abis-${TAG}.zip" abis/ deployments.json release-manifest.json \
            "dotns-genesis-${DOTNS_TLD}.json"

      - name: Generate release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          ASSET_BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"

          cat > release-body.md << 'ENDOFBODY'
          ## DotNS ABI Package

          **Contracts**
          | Contract | ABI |
          |----------|-----|
          ENDOFBODY

          for f in release/abis/*.json; do
            name=$(basename "$f" .json)
            echo "          | \`${name}\` | [${name}.json]($ASSET_BASE/${name}.json) |" >> release-body.md
          done

          cat >> release-body.md << 'ENDOFBODY'

          ### Download

          - **All ABIs (zip):** [dotns-abis-${TAG}.zip](${ASSET_BASE}/dotns-abis-${TAG}.zip)
          - **Individual ABIs:** Each contract ABI is also attached as a separate artifact

          ### Usage

          ```ts
          import StoreAbi from "./abis/Store.json";
          import RegistrarAbi from "./abis/DotnsRegistrar.json";
          ```
          ENDOFBODY

          sed -i 's/^          //' release-body.md
          # The heredocs above are quoted so the ```ts fence is not treated as command
          # substitution, which also leaves ${TAG} unexpanded. Substitute it here.
          sed -i "s|\${ASSET_BASE}|$ASSET_BASE|g; s|\${TAG}|$TAG|g" release-body.md

          # Networks and chain ids only. The addresses stay in the asset, so the body
          # cannot become another copy of them. Chain ids are not unique across networks,
          # which is why the table is keyed by network.
          {
            echo ""
            echo "### Deployments"
            echo ""
            echo "| Network | Chain id |"
            echo "|---------|---------:|"
            jq -r '.networks | to_entries[] | "| \(.key) | \(.value.chainId) |"' release/deployments.json
            echo ""
            echo "- **Addresses:** [deployments.json]($ASSET_BASE/deployments.json)"
            echo "- **Release contents:** [release-manifest.json]($ASSET_BASE/release-manifest.json)"

            # The genesis is TLD-specific, so the body has to say which TLD it carries —
            # a reader choosing an artifact for their chain needs that before they download it.
            echo ""
            echo "### Genesis"
            echo ""
            echo "Pallet-revive genesis state, for a chain that should carry DotNS from block zero"
            echo "rather than deploying it afterwards."
            echo ""
            echo "- [dotns-genesis-${DOTNS_TLD}.json]($ASSET_BASE/dotns-genesis-${DOTNS_TLD}.json) — registry initialised with the **\`.${DOTNS_TLD}\` TLD**, so it suits **${DOTNS_TLD} networks only** (this is what previewnet uses). Not for a production chain."
            echo "- Contract addresses are in [deployments.json]($ASSET_BASE/deployments.json); they derive from the CREATE3 factory, not from the TLD."
          } >> release-body.md

          # `gh release view` with no tag resolves through /releases/latest, which skips
          # drafts, so this is the previously published release and never the draft this run
          # is about to create.
          PREV=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$PREV" ] && gh release download "$PREV" --repo "$GITHUB_REPOSITORY" \
            --pattern deployments.json --dir prev >/dev/null 2>&1; then
            bun scripts/js/release-metadata.mjs changelog --current release/deployments.json \
              --previous prev/deployments.json --previous-tag "$PREV" >> release-body.md
          else
            bun scripts/js/release-metadata.mjs changelog \
              --current release/deployments.json >> release-body.md
          fi

      - name: Create draft release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          # Explicit because on workflow_dispatch there is no tag to infer; the action
          # creates it at this run's commit.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dotns-abis-*.zip
            release/abis/*.json
            release/deployments.json
            release/release-manifest.json
            release/dotns-genesis-${{ env.DOTNS_TLD }}.json
          body_path: release-body.md
          draft: true
          prerelease: false
          generate_release_notes: true

      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG="$RELEASE_TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort > "$RUNNER_TEMP/actual-assets.txt"
          { cat release/expected-assets.txt
            echo "dotns-abis-${TAG}.zip"
            echo "deployments.json"
            echo "release-manifest.json"
            echo "dotns-genesis-${DOTNS_TLD}.json"
          } | sort > "$RUNNER_TEMP/wanted-assets.txt"
          if ! diff -u "$RUNNER_TEMP/wanted-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "::error::Draft release $TAG does not match the expected asset set; delete the draft and re-run."
            exit 1
          fi
          echo "Verified $(wc -l < "$RUNNER_TEMP/wanted-assets.txt") assets on draft $TAG."

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published $TAG with its complete asset set."
