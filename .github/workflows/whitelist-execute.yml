name: Execute Whitelist On-Chain

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  whitelist:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'whitelist-approved' && contains(github.event.issue.labels.*.name, 'whitelist-request')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/retry') && contains(github.event.issue.labels.*.name, 'whitelist-approved') && contains(github.event.issue.labels.*.name, 'whitelist-request') && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.user.login == github.event.issue.user.login))
    runs-on: ubuntu-latest
    env:
      SUBSTRATE_RPC_URL: "wss://asset-hub-paseo-rpc.n.dwellir.com"
      BLOCKSCOUT_URL: "https://blockscout-testnet.polkadot.io"

    steps:
      - name: Acknowledge retry
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: context.payload.comment.id,
              content: "rocket",
            });

      - name: Extract address from issue body
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const addressMatch = body.match(/### Address\s*\n\s*(.+)/);

            if (!addressMatch) {
              core.setFailed("Could not extract address from issue body");
              return;
            }

            core.setOutput("address", addressMatch[1].trim());

      - name: Install dotns CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          TAG=$(gh release list --repo paritytech/dotns-sdk --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$TAG" --repo paritytech/dotns-sdk --pattern '*.tgz' --dir /tmp/dotns-cli
          npm install -g /tmp/dotns-cli/*.tgz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check account mapped
        id: resolve
        env:
          ADDRESS: ${{ steps.extract.outputs.address }}
          DOTNS_MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
        run: |
          if ! RESULT=$(dotns account is-mapped "$ADDRESS" --rpc "$SUBSTRATE_RPC_URL" --json -m "$DOTNS_MNEMONIC" 2>&1); then
            echo "::error::dotns account is-mapped failed: $RESULT"
            exit 1
          fi

          IS_MAPPED=$(echo "$RESULT" | jq -r '.isMapped')
          EVM_ADDRESS=$(echo "$RESULT" | jq -r '.evmAddress')
          ORIGINAL_ADDRESS=$(echo "$RESULT" | jq -r '.address')

          echo "evm_address=$EVM_ADDRESS" >> "$GITHUB_OUTPUT"
          echo "original_address=$ORIGINAL_ADDRESS" >> "$GITHUB_OUTPUT"
          echo "is_mapped=$IS_MAPPED" >> "$GITHUB_OUTPUT"

          if echo "$ADDRESS" | grep -qE '^0x[0-9a-fA-F]{40}$'; then
            echo "was_converted=false" >> "$GITHUB_OUTPUT"
          else
            echo "was_converted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment if account not mapped
        if: steps.resolve.outputs.is_mapped == 'false'
        uses: actions/github-script@v7
        env:
          ORIGINAL_ADDRESS: ${{ steps.resolve.outputs.original_address }}
          EVM_ADDRESS: ${{ steps.resolve.outputs.evm_address }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const author = context.payload.issue.user.login;
            const original = process.env.ORIGINAL_ADDRESS;
            const evm = process.env.EVM_ADDRESS;

            const section = [
              "",
              "---",
              "",
              "### Account Not Mapped",
              "",
              `@${author} Your Substrate address \`${original}\` has not been mapped to its EVM address (\`${evm}\`) on-chain yet.`,
              "",
              "Before your address can be whitelisted you need to map your account. Install the [DotNS CLI](https://github.com/paritytech/dotns-sdk/releases) and run:",
              "",
              "```bash",
              `dotns account map --rpc wss://services.polkadothub-rpc.com/testnet -m "<your mnemonic>"`,
              "```",
              "",
              "Run `dotns account --help` for all authentication options (keystore, key URI, etc.).",
              "",
              "Once your account is mapped, comment `/retry` on this issue to try again.",
              "",
              "cc @waytwotall @andrew-ifrita @sphamjoli",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: existing.body + section });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: marker + section });
            }

            core.setFailed("Account not mapped on-chain");

      - name: Check if already whitelisted
        if: steps.resolve.outputs.is_mapped == 'true'
        id: precheck
        env:
          ADDRESS: ${{ steps.resolve.outputs.evm_address }}
          DOTNS_MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
        run: |
          RESULT=$(dotns account is-whitelisted "$ADDRESS" --rpc "$SUBSTRATE_RPC_URL" --json -m "$DOTNS_MNEMONIC")
          ALREADY=$(echo "$RESULT" | jq -r '.isWhitelisted')
          echo "already_whitelisted=$ALREADY" >> "$GITHUB_OUTPUT"

      - name: Comment if already whitelisted
        if: steps.resolve.outputs.is_mapped == 'true' && steps.precheck.outputs.already_whitelisted == 'true'
        uses: actions/github-script@v7
        env:
          ADDRESS: ${{ steps.resolve.outputs.evm_address }}
          ORIGINAL_ADDRESS: ${{ steps.resolve.outputs.original_address }}
          WAS_CONVERTED: ${{ steps.resolve.outputs.was_converted }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const author = context.payload.issue.user.login;
            const address = process.env.ADDRESS;
            const originalAddress = process.env.ORIGINAL_ADDRESS;
            const wasConverted = process.env.WAS_CONVERTED === "true";
            const explorerUrl = process.env.BLOCKSCOUT_URL;

            const lines = [
              "",
              "---",
              "",
              "### Already Whitelisted",
              "",
            ];

            if (wasConverted) {
              lines.push(`**Substrate Address:** \`${originalAddress}\``);
              lines.push(`**Mapped EVM Address:** \`${address}\``);
            } else {
              lines.push(`**Address:** \`${address}\``);
            }

            lines.push("");
            lines.push(`@${author} This address is already whitelisted on-chain. No action needed.`);
            lines.push("");
            lines.push(`[View on Blockscout](${explorerUrl}/address/${address})`);
            lines.push("");
            lines.push("cc @waytwotall @andrew-ifrita @sphamjoli");

            const section = lines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: existing.body + section });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: marker + section });
            }

            await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });

      - name: Whitelist address on-chain
        if: steps.resolve.outputs.is_mapped == 'true' && steps.precheck.outputs.already_whitelisted != 'true'
        id: execute
        env:
          DOTNS_MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
          ADDRESS: ${{ steps.resolve.outputs.evm_address }}
        run: |
          RESULT=$(dotns account whitelist "$ADDRESS" --rpc "$SUBSTRATE_RPC_URL" --json -m "$DOTNS_MNEMONIC")

          TX_HASH=$(echo "$RESULT" | jq -r '.txHash')
          WHITELISTED=$(echo "$RESULT" | jq -r '.whitelisted')

          echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"
          echo "whitelisted=$WHITELISTED" >> "$GITHUB_OUTPUT"

      - name: Comment and close issue on success
        if: success() && steps.resolve.outputs.is_mapped == 'true' && steps.precheck.outputs.already_whitelisted != 'true'
        uses: actions/github-script@v7
        env:
          TX_HASH: ${{ steps.execute.outputs.tx_hash }}
          ADDRESS: ${{ steps.resolve.outputs.evm_address }}
          ORIGINAL_ADDRESS: ${{ steps.resolve.outputs.original_address }}
          WAS_CONVERTED: ${{ steps.resolve.outputs.was_converted }}
          WHITELISTED: ${{ steps.execute.outputs.whitelisted }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const author = context.payload.issue.user.login;
            const txHash = process.env.TX_HASH;
            const address = process.env.ADDRESS;
            const originalAddress = process.env.ORIGINAL_ADDRESS;
            const wasConverted = process.env.WAS_CONVERTED === "true";
            const whitelisted = process.env.WHITELISTED;
            const explorerUrl = process.env.BLOCKSCOUT_URL;

            const lines = [
              "",
              "---",
              "",
              "### Address Whitelisted",
              "",
            ];

            if (wasConverted) {
              lines.push(`**Substrate Address:** \`${originalAddress}\``);
              lines.push(`**Mapped EVM Address:** \`${address}\``);
            } else {
              lines.push(`**Address:** \`${address}\``);
            }

            lines.push(`**Transaction:** [\`${txHash}\`](${explorerUrl}/tx/${txHash})`);
            lines.push(`**On-chain verified:** \`isWhiteListed\` = \`${whitelisted}\``);
            lines.push("");
            lines.push(`[View on Blockscout](${explorerUrl}/address/${address})`);
            lines.push("");
            lines.push(`@${author} Your address has been whitelisted. This means your address can now bypass Proof of Personhood (POP) rules when registering .dot names. Note that whitelisting does not register a name for you -- it only allows your address to skip POP verification during the registration process.`);
            lines.push("");
            lines.push("cc @waytwotall @andrew-ifrita @sphamjoli");

            const section = lines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: existing.body + section });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: marker + section });
            }

            await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });

      - name: Comment on failure
        if: failure() && steps.resolve.outputs.is_mapped != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const author = context.payload.issue.user.login;

            const section = [
              "",
              "---",
              "",
              "### Whitelisting Failed",
              "",
              `@${author} The on-chain transaction failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`,
              "",
              "Comment `/retry` on this issue to try again.",
              "",
              "cc @waytwotall @andrew-ifrita @sphamjoli",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: existing.body + section });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: marker + section });
            }
