name: Execute Whitelist On-Chain

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: whitelist-execute
  cancel-in-progress: false

jobs:
  whitelist:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'whitelist-approved' && contains(github.event.issue.labels.*.name, 'whitelist-request')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/retry') && contains(github.event.issue.labels.*.name, 'whitelist-approved') && contains(github.event.issue.labels.*.name, 'whitelist-request') && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.user.login == github.event.issue.user.login))
    runs-on: ubuntu-latest

    steps:
      - name: Acknowledge retry
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: context.payload.comment.id,
              content: "rocket",
            });

      - name: Load CODEOWNERS reviewers
        id: codeowners
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/CODEOWNERS",
              ref: context.payload.repository.default_branch,
            });
            const content = Buffer.from(data.content, data.encoding || "base64").toString("utf8");
            const mentions = [...new Set(content.match(/@[A-Za-z0-9-]+(?:\/[A-Za-z0-9_.-]+)?/g) || [])];
            core.setOutput("mentions", mentions.join(" "));

      - name: Guard retry command
        id: retry_guard
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const retryNoopMarker = "<!-- dotns-whitelist-retry-noop -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const author = context.payload.issue.user.login;
            const commenter = context.payload.comment.user.login;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const botComments = comments.filter(c => c.body && c.body.includes(marker));
            const retryable = botComments.some(c =>
              c.body.includes("### Account Not Mapped") ||
              c.body.includes("### Whitelisting Failed")
            );
            const completed = botComments.some(c =>
              c.body.includes("### Address Whitelisted") ||
              c.body.includes("### Already Whitelisted")
            );

            if (retryable && !completed) {
              core.setOutput("noop", "false");
              return;
            }

            const previousNoops = comments.filter(c => c.body && c.body.includes(retryNoopMarker)).length;
            const lines = [
              marker,
              retryNoopMarker,
              "### Retry Not Needed",
              "",
              `@${commenter} \`/retry\` does not approve or whitelist this account. It only re-checks a request after the workflow has asked for a retry, such as after account mapping is completed or after a previous workflow failure.`,
              "",
              completed
                ? `This request already has a completed whitelist result, so this retry is a no-op.`
                : `There is no retryable whitelist state on this issue right now, so this retry is a no-op.`,
            ];

            if (previousNoops >= 1) {
              lines.push("");
              lines.push("Repeated `/retry` comments will continue to do nothing unless the workflow asks for a retry first. A maintainer can review the issue if you are unsure what is blocking it.");
              lines.push("");
              lines.push(`cc ${process.env.REVIEWERS}`);
            }

            if (author !== commenter) {
              lines.push("");
              lines.push(`Original requester: @${author}`);
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: lines.join("\n"),
            });

            core.setOutput("noop", "true");

      - name: Extract address from issue body
        id: extract
        if: steps.retry_guard.outputs.noop != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            function field(name) {
              const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const match = body.match(new RegExp(`### ${escaped}\\s*\\n([\\s\\S]*?)(?=\\n### |$)`));
              return match ? match[1].trim() : "";
            }

            const address = field("Address").split("\n")[0].trim();
            const addressType = field("Address Type").split("\n")[0].trim();
            const network = field("Network").split("\n")[0].trim();
            const description = field("Description").trim();
            const missing = [];

            if (!address) missing.push("Address");
            if (!["EVM (H160)", "Substrate (SS58)"].includes(addressType)) {
              missing.push("Address Type");
            }
            if (!["Paseo V2"].includes(network)) {
              missing.push("Network");
            }
            if (description.length < 30) {
              missing.push("Description (at least 30 characters explaining why the bypass is needed)");
            }

            core.setOutput("address", address);
            core.setOutput("address_type", addressType);
            core.setOutput("network", network);
            core.setOutput("description", description);
            core.setOutput("fields_ok", missing.length === 0 ? "true" : "false");
            core.setOutput("missing_fields", missing.join(", "));

      - name: Resolve network config
        id: network
        if: steps.retry_guard.outputs.noop != 'true' && steps.extract.outputs.fields_ok == 'true'
        uses: actions/github-script@v7
        env:
          NETWORK: ${{ steps.extract.outputs.network }}
        with:
          script: |
            const configs = {
              "Paseo V2": {
                env: "paseo-v2",
                rpc: "wss://paseo-asset-hub-next-rpc.polkadot.io",
                explorer: "https://blockscout-testnet.polkadot.io",
              },
            };

            const network = process.env.NETWORK;
            const config = configs[network];
            if (!config) {
              core.setFailed(`Unsupported whitelist network: ${network}`);
              return;
            }

            core.setOutput("name", network);
            core.setOutput("env", config.env);
            core.setOutput("rpc", config.rpc);
            core.setOutput("explorer", config.explorer);

      - name: Guard request fields
        id: field_guard
        if: steps.retry_guard.outputs.noop != 'true' && steps.extract.outputs.fields_ok != 'true'
        uses: actions/github-script@v7
        env:
          MISSING_FIELDS: ${{ steps.extract.outputs.missing_fields }}
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const invalidMarker = "<!-- dotns-whitelist-invalid-attempt -->";
            const maxAttempts = 3;
            const reviewers = process.env.REVIEWERS;
            const missing = process.env.MISSING_FIELDS;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const attempts = comments.filter(c => c.body && c.body.includes(invalidMarker)).length + 1;
            const closeIssue = attempts >= maxAttempts;

            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "whitelist-approved" });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: closeIssue ? ["needs-info", "needs-review"] : ["needs-info"],
            });

            const section = [
              "",
              "---",
              "",
              invalidMarker,
              "### Whitelist Request Incomplete",
              "",
              `**Needs:** ${missing}`,
              "",
              `Attempt ${attempts} of ${maxAttempts}.`,
              "",
              "The whitelist workflow has stopped and removed `whitelist-approved`.",
              "Please update the issue body with a valid EVM or Substrate address, the matching address type, the network to whitelist against, and a clear description of why the PoP bypass is needed.",
            ];

            if (closeIssue) {
              section.push("");
              section.push(`This request has reached ${maxAttempts} invalid attempts, so it is being closed for review.`);
              section.push(`cc ${reviewers}`);
            }

            const body = section.join("\n");
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: existing.body + body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: marker + body });
            }

            if (closeIssue) {
              await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
            }

            core.setOutput("blocked", "true");
            core.setFailed("Whitelist request fields are incomplete");

      - name: Load approved address cache
        id: approval_cache
        if: steps.retry_guard.outputs.noop != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- dotns-whitelist-approval-cache -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const cached = comments.find(c => c.body && c.body.includes(marker));

            if (!cached) {
              core.setOutput("approved_address", "");
              core.setOutput("has_cache", "false");
              return;
            }

            const match = cached.body.match(/<!-- dotns-whitelist-approved-address:([^>]+) -->/);
            const sourceMatch =
              cached.body.match(/<!-- dotns-whitelist-approved-source-address:([^>]+) -->/);
            const networkMatch =
              cached.body.match(/<!-- dotns-whitelist-approved-network:([^>]+) -->/);
            core.setOutput("approved_address", match ? match[1].trim() : "");
            core.setOutput("approved_source_address", sourceMatch ? sourceMatch[1].trim() : "");
            core.setOutput("approved_network", networkMatch ? networkMatch[1].trim() : "");
            core.setOutput("has_cache", match ? "true" : "false");

      - name: Cache approved source address
        if: github.event_name == 'issues' && steps.retry_guard.outputs.noop != 'true'
        uses: actions/github-script@v7
        env:
          BODY_ADDRESS: ${{ steps.extract.outputs.address }}
          NETWORK: ${{ steps.extract.outputs.network }}
        with:
          script: |
            const approvalMarker = "<!-- dotns-whitelist-approval-cache -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const sourceAddress = (process.env.BODY_ADDRESS || "").trim();
            const network = (process.env.NETWORK || "").trim();
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const approvalComment = comments.find(c => c.body && c.body.includes(approvalMarker));

            const cacheBody = [
              approvalMarker,
              "<!-- dotns-whitelist-approved-address: -->",
              `<!-- dotns-whitelist-approved-source-address:${sourceAddress} -->`,
              `<!-- dotns-whitelist-approved-network:${network} -->`,
              "",
              "### Whitelist Approval Cache",
              "",
              `**Source address:** \`${sourceAddress}\``,
              `**Network:** ${network}`,
              "",
              "This comment freezes the submitted EVM or Substrate address and selected network approved by maintainers. The resolved EVM address is filled once account mapping is available.",
            ].join("\n");

            if (approvalComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: approvalComment.id,
                body: cacheBody,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: cacheBody });
            }

      - name: Guard approved source address
        id: source_guard
        if: github.event_name == 'issue_comment' && steps.retry_guard.outputs.noop != 'true'
        uses: actions/github-script@v7
        env:
          APPROVED_SOURCE_ADDRESS: ${{ steps.approval_cache.outputs.approved_source_address }}
          APPROVED_NETWORK: ${{ steps.approval_cache.outputs.approved_network }}
          BODY_ADDRESS: ${{ steps.extract.outputs.address }}
          NETWORK: ${{ steps.extract.outputs.network }}
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const botMarker = "<!-- dotns-whitelist-bot -->";
            const invalidMarker = "<!-- dotns-whitelist-invalid-attempt -->";
            const maxAttempts = 3;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const approvedSource = (process.env.APPROVED_SOURCE_ADDRESS || "").trim();
            const approvedNetwork = (process.env.APPROVED_NETWORK || "").trim();
            const bodyAddress = (process.env.BODY_ADDRESS || "").trim();
            const network = (process.env.NETWORK || "").trim();
            const reviewers = process.env.REVIEWERS;

            function normaliseForCompare(address) {
              return /^0x[0-9a-fA-F]{40}$/.test(address) ? address.toLowerCase() : address;
            }

            function isZeroEvmAddress(address) {
              return /^0x0{40}$/i.test(address);
            }

            async function removeApprovalAndWarn(title, lines) {
              core.setOutput("blocked", "true");
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
              const attempts = comments.filter(c => c.body && c.body.includes(invalidMarker)).length + 1;
              const closeIssue = attempts >= maxAttempts;

              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "whitelist-approved" });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: closeIssue ? ["needs-review", "needs-info"] : ["needs-review"],
              });

              const section = [
                "",
                "---",
                "",
                invalidMarker,
                `### ${title}`,
                "",
                ...lines,
                "",
                `Attempt ${attempts} of ${maxAttempts}.`,
                "",
                "For safety, this workflow has stopped and removed `whitelist-approved`.",
                "A maintainer must review and re-approve the address before whitelisting can continue.",
              ].join("\n");

              const closeSection = closeIssue
                ? [
                    "",
                    `This request has reached ${maxAttempts} invalid attempts, so it is being closed for review.`,
                    `cc ${reviewers}`,
                  ].join("\n")
                : "";

              const existing = comments.find(c => c.body && c.body.includes(botMarker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: existing.body + section + closeSection,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: botMarker + section + closeSection,
                });
              }

              if (closeIssue) {
                await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
              }
            }

            if (!approvedSource) {
              await removeApprovalAndWarn("Whitelist Approval Missing Address Cache", [
                "This issue was approved before the workflow cached the submitted EVM or Substrate address.",
                `**Current issue address:** \`${bodyAddress}\``,
                `**Current network:** ${network}`,
              ]);
              core.setFailed("Approved whitelist issue has no cached source address");
              return;
            }

            if (isZeroEvmAddress(bodyAddress)) {
              await removeApprovalAndWarn("Whitelist Zero Address Rejected", [
                "The submitted address is the EVM zero address.",
                `**Current issue address:** \`${bodyAddress}\``,
              ]);
              core.setFailed("Whitelist request uses the EVM zero address");
              return;
            }

            if (normaliseForCompare(approvedSource) !== normaliseForCompare(bodyAddress)) {
              await removeApprovalAndWarn("Whitelist Address Changed After Approval", [
                "The address in this request changed after `whitelist-approved` was applied.",
                `**Approved source address:** \`${approvedSource}\``,
                `**Current issue address:** \`${bodyAddress}\``,
              ]);
              core.setFailed("Whitelist request source address changed after approval");
              return;
            }

            if (approvedNetwork && approvedNetwork !== network) {
              await removeApprovalAndWarn("Whitelist Network Changed After Approval", [
                "The network in this request changed after `whitelist-approved` was applied.",
                `**Approved network:** ${approvedNetwork}`,
                `**Current network:** ${network}`,
              ]);
              core.setFailed("Whitelist request network changed after approval");
              return;
            }

            core.setOutput("blocked", "false");

      - name: Install dotns CLI
        if: steps.retry_guard.outputs.noop != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.retry_guard.outputs.noop != 'true'
        run: |
          TAG=v0.6.2
          gh release download "$TAG" --repo paritytech/dotns-sdk --pattern '*.tgz' --dir /tmp/dotns-cli
          npm install -g /tmp/dotns-cli/*.tgz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check account mapped
        id: resolve
        if: steps.retry_guard.outputs.noop != 'true'
        env:
          ADDRESS: ${{ steps.extract.outputs.address }}
          DOTNS_ENV: ${{ steps.network.outputs.env }}
          DOTNS_MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
        run: |
          if ! RESULT=$(dotns account is-mapped "$ADDRESS" --env "$DOTNS_ENV" --json -m "$DOTNS_MNEMONIC" 2>&1); then
            echo "::error::dotns account is-mapped failed: $RESULT"
            exit 1
          fi

          IS_MAPPED=$(echo "$RESULT" | jq -r '.isMapped')
          EVM_ADDRESS=$(echo "$RESULT" | jq -r '.evmAddress')
          ORIGINAL_ADDRESS=$(echo "$RESULT" | jq -r '.address')

          {
            echo "evm_address=$EVM_ADDRESS"
            echo "original_address=$ORIGINAL_ADDRESS"
            echo "is_mapped=$IS_MAPPED"
          } >> "$GITHUB_OUTPUT"

          if echo "$ADDRESS" | grep -qE '^0x[0-9a-fA-F]{40}$'; then
            echo "was_converted=false" >> "$GITHUB_OUTPUT"
          else
            echo "was_converted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze approved address
        id: approved_address
        if: steps.retry_guard.outputs.noop != 'true' && steps.resolve.outputs.is_mapped == 'true'
        uses: actions/github-script@v7
        env:
          APPROVED_ADDRESS: ${{ steps.approval_cache.outputs.approved_address }}
          APPROVED_SOURCE_ADDRESS: ${{ steps.approval_cache.outputs.approved_source_address }}
          APPROVED_NETWORK: ${{ steps.approval_cache.outputs.approved_network }}
          BODY_ADDRESS: ${{ steps.extract.outputs.address }}
          NETWORK: ${{ steps.extract.outputs.network }}
          CURRENT_EVM_ADDRESS: ${{ steps.resolve.outputs.evm_address }}
          ORIGINAL_ADDRESS: ${{ steps.resolve.outputs.original_address }}
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const approvalMarker = "<!-- dotns-whitelist-approval-cache -->";
            const botMarker = "<!-- dotns-whitelist-bot -->";
            const invalidMarker = "<!-- dotns-whitelist-invalid-attempt -->";
            const maxAttempts = 3;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const eventName = context.eventName;
            const approved = (process.env.APPROVED_ADDRESS || "").trim();
            const approvedSource = (process.env.APPROVED_SOURCE_ADDRESS || "").trim();
            const approvedNetwork = (process.env.APPROVED_NETWORK || "").trim();
            const current = (process.env.CURRENT_EVM_ADDRESS || "").trim();
            const bodyAddress = (process.env.BODY_ADDRESS || "").trim();
            const network = (process.env.NETWORK || "").trim();
            const original = (process.env.ORIGINAL_ADDRESS || "").trim();
            const reviewers = process.env.REVIEWERS;

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const approvalComment = comments.find(c => c.body && c.body.includes(approvalMarker));

            async function removeApprovalAndWarn(title, lines) {
              core.setOutput("blocked", "true");
              const attempts = comments.filter(c => c.body && c.body.includes(invalidMarker)).length + 1;
              const closeIssue = attempts >= maxAttempts;

              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "whitelist-approved" });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: closeIssue ? ["needs-review", "needs-info"] : ["needs-review"],
              });

              const section = [
                "",
                "---",
                "",
                invalidMarker,
                `### ${title}`,
                "",
                ...lines,
                "",
                `Attempt ${attempts} of ${maxAttempts}.`,
                "",
                "For safety, this workflow has stopped and removed `whitelist-approved`.",
                "A maintainer must review and re-approve the address before whitelisting can continue.",
              ].join("\n");

              const closeSection = closeIssue
                ? [
                    "",
                    `This request has reached ${maxAttempts} invalid attempts, so it is being closed for review.`,
                    `cc ${reviewers}`,
                  ].join("\n")
                : "";

              const existing = comments.find(c => c.body && c.body.includes(botMarker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: existing.body + section + closeSection,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: botMarker + section + closeSection,
                });
              }

              if (closeIssue) {
                await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
              }
            }

            function normaliseForCompare(address) {
              return /^0x[0-9a-fA-F]{40}$/.test(address) ? address.toLowerCase() : address;
            }

            function isZeroEvmAddress(address) {
              return /^0x0{40}$/i.test(address);
            }

            if (isZeroEvmAddress(bodyAddress) || isZeroEvmAddress(current)) {
              await removeApprovalAndWarn("Whitelist Zero Address Rejected", [
                "The submitted or resolved address is the EVM zero address.",
                `**Current issue address:** \`${bodyAddress}\``,
                `**Current resolved EVM address:** \`${current}\``,
              ]);
              core.setFailed("Whitelist request uses the EVM zero address");
              return;
            }

            if (eventName === "issue_comment") {
              if (!approvedSource) {
                await removeApprovalAndWarn("Whitelist Approval Missing Address Cache", [
                  "This issue was approved before the workflow cached the approved source address.",
                  `**Current issue address:** \`${bodyAddress}\``,
                  `**Current network:** ${network}`,
                  `**Resolved EVM address:** \`${current}\``,
                ]);
                core.setFailed("Approved whitelist issue has no cached address");
                return;
              }

              const sourceChanged =
                normaliseForCompare(approvedSource) !== normaliseForCompare(bodyAddress);
              const evmChanged = approved && approved.toLowerCase() !== current.toLowerCase();
              const networkChanged = approvedNetwork && approvedNetwork !== network;

              if (sourceChanged || evmChanged || networkChanged) {
                await removeApprovalAndWarn("Whitelist Request Changed After Approval", [
                  "The address or network in this request changed after `whitelist-approved` was applied.",
                  `**Approved source address:** \`${approvedSource}\``,
                  approved ? `**Approved EVM address:** \`${approved}\`` : "**Approved EVM address:** pending account mapping",
                  approvedNetwork ? `**Approved network:** ${approvedNetwork}` : "**Approved network:** not cached",
                  `**Current issue address:** \`${bodyAddress}\``,
                  `**Current network:** ${network}`,
                  `**Current resolved EVM address:** \`${current}\``,
                ]);
                core.setFailed("Whitelist request changed after approval");
                return;
              }
            }

            const cacheBody = [
              approvalMarker,
              `<!-- dotns-whitelist-approved-address:${current} -->`,
              `<!-- dotns-whitelist-approved-source-address:${bodyAddress} -->`,
              `<!-- dotns-whitelist-approved-network:${network} -->`,
              "",
              "### Whitelist Approval Cache",
              "",
              `**Approved EVM address:** \`${current}\``,
              `**Source address:** \`${bodyAddress}\``,
              `**Resolved source address:** \`${original}\``,
              `**Network:** ${network}`,
              "",
              "This comment freezes the submitted EVM or Substrate address and selected network approved by maintainers. Retries use these values and stop if the issue body is later changed.",
            ].join("\n");

            if (approvalComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: approvalComment.id,
                body: cacheBody,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: cacheBody });
            }

            core.setOutput("blocked", "false");

      - name: Comment if account not mapped
        if: steps.retry_guard.outputs.noop != 'true' && steps.resolve.outputs.is_mapped == 'false'
        uses: actions/github-script@v7
        env:
          ORIGINAL_ADDRESS: ${{ steps.resolve.outputs.original_address }}
          EVM_ADDRESS: ${{ steps.resolve.outputs.evm_address }}
          NETWORK: ${{ steps.extract.outputs.network }}
          DOTNS_ENV: ${{ steps.network.outputs.env }}
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const author = context.payload.issue.user.login;
            const original = process.env.ORIGINAL_ADDRESS;
            const evm = process.env.EVM_ADDRESS;
            const network = process.env.NETWORK;
            const dotnsEnv = process.env.DOTNS_ENV;

            const section = [
              "",
              "---",
              "",
              "### Account Not Mapped",
              "",
              `**Network:** ${network}`,
              "",
              `@${author} Your Substrate address \`${original}\` has not been mapped to its EVM address (\`${evm}\`) on-chain yet.`,
              "",
              "Before your address can be whitelisted you need to map your account. Install the [DotNS CLI](https://github.com/paritytech/dotns-sdk/releases) and run:",
              "",
              "```bash",
              `dotns account map --env ${dotnsEnv} -m "<your mnemonic>"`,
              "```",
              "",
              "Run `dotns account --help` for all authentication options (keystore, key URI, etc.).",
              "",
              "This issue has been closed. Once your account is mapped, comment `/retry` on this closed issue to re-check mapping and continue the approved workflow. `/retry` does not whitelist the account by itself.",
              "",
              `cc ${process.env.REVIEWERS}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: existing.body + section });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: marker + section });
            }

            await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });

            core.setFailed("Account not mapped on-chain");

      - name: Check if already whitelisted
        if: steps.retry_guard.outputs.noop != 'true' && steps.resolve.outputs.is_mapped == 'true'
        id: precheck
        env:
          ADDRESS: ${{ steps.resolve.outputs.evm_address }}
          DOTNS_ENV: ${{ steps.network.outputs.env }}
          DOTNS_MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
        run: |
          RESULT=$(dotns account is-whitelisted "$ADDRESS" --env "$DOTNS_ENV" --json -m "$DOTNS_MNEMONIC")
          ALREADY=$(echo "$RESULT" | jq -r '.isWhitelisted')
          echo "already_whitelisted=$ALREADY" >> "$GITHUB_OUTPUT"

      - name: Comment if already whitelisted
        if: steps.retry_guard.outputs.noop != 'true' && steps.resolve.outputs.is_mapped == 'true' && steps.precheck.outputs.already_whitelisted == 'true'
        uses: actions/github-script@v7
        env:
          ADDRESS: ${{ steps.resolve.outputs.evm_address }}
          ORIGINAL_ADDRESS: ${{ steps.resolve.outputs.original_address }}
          WAS_CONVERTED: ${{ steps.resolve.outputs.was_converted }}
          NETWORK: ${{ steps.extract.outputs.network }}
          BLOCKSCOUT_URL: ${{ steps.network.outputs.explorer }}
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const author = context.payload.issue.user.login;
            const address = process.env.ADDRESS;
            const originalAddress = process.env.ORIGINAL_ADDRESS;
            const wasConverted = process.env.WAS_CONVERTED === "true";
            const network = process.env.NETWORK;
            const explorerUrl = process.env.BLOCKSCOUT_URL;

            const lines = [
              "",
              "---",
              "",
              "### Already Whitelisted",
              "",
            ];

            lines.push(`**Network:** ${network}`);

            if (wasConverted) {
              lines.push(`**Substrate Address:** \`${originalAddress}\``);
              lines.push(`**Mapped EVM Address:** \`${address}\``);
            } else {
              lines.push(`**Address:** \`${address}\``);
            }

            lines.push("");
            lines.push(`@${author} This address is already whitelisted on-chain. No action needed.`);
            lines.push("");
            lines.push(`[View on Blockscout](${explorerUrl}/address/${address})`);
            lines.push("");
            lines.push(`cc ${process.env.REVIEWERS}`);

            const section = lines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: existing.body + section });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: marker + section });
            }

            await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });

      - name: Whitelist address on-chain
        if: steps.retry_guard.outputs.noop != 'true' && steps.resolve.outputs.is_mapped == 'true' && steps.precheck.outputs.already_whitelisted != 'true'
        id: execute
        env:
          DOTNS_MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
          ADDRESS: ${{ steps.resolve.outputs.evm_address }}
          DOTNS_ENV: ${{ steps.network.outputs.env }}
        run: |
          RESULT=$(dotns account whitelist "$ADDRESS" --env "$DOTNS_ENV" --json -m "$DOTNS_MNEMONIC")

          TX_HASH=$(echo "$RESULT" | jq -r '.txHash')
          WHITELISTED=$(echo "$RESULT" | jq -r '.whitelisted')

          echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"
          echo "whitelisted=$WHITELISTED" >> "$GITHUB_OUTPUT"

      - name: Comment and close issue on success
        if: success() && steps.retry_guard.outputs.noop != 'true' && steps.resolve.outputs.is_mapped == 'true' && steps.precheck.outputs.already_whitelisted != 'true'
        uses: actions/github-script@v7
        env:
          TX_HASH: ${{ steps.execute.outputs.tx_hash }}
          ADDRESS: ${{ steps.resolve.outputs.evm_address }}
          ORIGINAL_ADDRESS: ${{ steps.resolve.outputs.original_address }}
          WAS_CONVERTED: ${{ steps.resolve.outputs.was_converted }}
          WHITELISTED: ${{ steps.execute.outputs.whitelisted }}
          NETWORK: ${{ steps.extract.outputs.network }}
          BLOCKSCOUT_URL: ${{ steps.network.outputs.explorer }}
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const author = context.payload.issue.user.login;
            const txHash = process.env.TX_HASH;
            const address = process.env.ADDRESS;
            const originalAddress = process.env.ORIGINAL_ADDRESS;
            const wasConverted = process.env.WAS_CONVERTED === "true";
            const whitelisted = process.env.WHITELISTED;
            const network = process.env.NETWORK;
            const explorerUrl = process.env.BLOCKSCOUT_URL;

            const lines = [
              "",
              "---",
              "",
              "### Address Whitelisted",
              "",
            ];

            lines.push(`**Network:** ${network}`);

            if (wasConverted) {
              lines.push(`**Substrate Address:** \`${originalAddress}\``);
              lines.push(`**Mapped EVM Address:** \`${address}\``);
            } else {
              lines.push(`**Address:** \`${address}\``);
            }

            lines.push(`**Transaction:** [\`${txHash}\`](${explorerUrl}/tx/${txHash})`);
            lines.push(`**On-chain verified:** \`isWhiteListed\` = \`${whitelisted}\``);
            lines.push("");
            lines.push(`[View on Blockscout](${explorerUrl}/address/${address})`);
            lines.push("");
            lines.push(`@${author} Your address has been whitelisted. This means your address can now bypass Proof of Personhood (POP) rules when registering .dot names. Note that whitelisting does not register a name for you -- it only allows your address to skip POP verification during the registration process.`);
            lines.push("");
            lines.push(`cc ${process.env.REVIEWERS}`);

            const section = lines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: existing.body + section });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: marker + section });
            }

            await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });

      - name: Comment on failure
        if: failure() && steps.retry_guard.outputs.noop != 'true' && steps.field_guard.outputs.blocked != 'true' && steps.resolve.outputs.is_mapped != 'false' && steps.source_guard.outputs.blocked != 'true' && steps.approved_address.outputs.blocked != 'true'
        uses: actions/github-script@v7
        env:
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const author = context.payload.issue.user.login;

            const section = [
              "",
              "---",
              "",
              "### Whitelisting Failed",
              "",
              `@${author} The on-chain transaction failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`,
              "",
              "This issue has been closed. If the underlying problem is fixed, comment `/retry` on this closed issue to run the workflow again. `/retry` does not approve or whitelist the account by itself.",
              "",
              `cc ${process.env.REVIEWERS}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: existing.body + section });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: marker + section });
            }

            await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
