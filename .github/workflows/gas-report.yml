name: Gas Report

on:
  pull_request:
    branches: [main]
    paths: ["contracts/**", "test/**", "**.sol"]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: gas-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gas-report:
    runs-on: parity-int-ubuntu-xl
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # Parity internal runners ship a minimal image; `oven-sh/setup-bun@v2`
      # extracts a zip archive at install time and needs `unzip` on PATH.
      - name: Install unzip (required by oven-sh/setup-bun on parity-int-* images)
        run: sudo apt-get update && sudo apt-get install -y unzip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"

      # `openzeppelin-foundry-upgrades` shells out to `npx @openzeppelin/upgrades-core`
      # via `vm.ffi` during tests; bun does not provide `npx`, so install Node here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bun install

      - name: Start revive-eth-rpc (paseo_local fork target)
        run: |
          docker compose up -d --build
          bash scripts/shell/wait-for-eth-rpc.sh

      - name: Generate gas report (PR branch)
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
          FOUNDRY_PROFILE: "gas"
        run: |
          # `rm -rf out/build-info` is load-bearing: forge test re-invokes solc
          # with a narrower outputSelection than forge build, can overwrite the
          # full build-info with a partial one, and the OZ validator (which runs
          # at test execution time via vm.ffi) then rejects it. Removing only
          # the build-info dir forces forge build to write a fresh complete one
          # while preserving the solc compilation cache under `cache/`.
          rm -rf out/build-info
          forge build
          forge test --gas-report --no-match-path 'test/fork/**' 2>&1 | tee pr-gas-report.txt

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch
          submodules: recursive

      - name: Generate gas report (main branch)
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
          FOUNDRY_PROFILE: "gas"
        working-directory: main-branch
        run: |
          bun install
          # Until the OZ payable patches land on main, the main checkout
          # produces vanilla OZ via setup.bash and the payable transferFrom
          # overrides on `DotnsRegistrar`/`IDotnsRegistrar` fail to compile.
          # Copy the patches and the apply script from the PR-branch checkout
          # and re-apply against main's freshly cloned `lib/`. Once main merges
          # the patches this becomes an idempotent overwrite.
          rm -rf patches
          cp -R ../patches ./patches
          mkdir -p scripts/shell
          cp ../scripts/shell/apply-oz-patches.sh scripts/shell/apply-oz-patches.sh
          chmod +x scripts/shell/apply-oz-patches.sh
          bash scripts/shell/apply-oz-patches.sh
          rm -rf out/build-info
          forge build
          forge test --gas-report --no-match-path 'test/fork/**' 2>&1 | tee ../main-gas-report.txt

      - name: Tear down revive-eth-rpc
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Generate HTML and markdown reports
        id: diff
        run: |
          if python3 scripts/reports/gas-report.py main-gas-report.txt pr-gas-report.txt; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "result=Failed - report generation error" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set deploy path
        id: path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "target=gas/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER}.github.io/${REPO_NAME}/gas/pr-${PR_NUM}/gas-report.html" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy directory
        run: |
          mkdir -p gas-output
          cp gas-report.html gas-output/
          touch gas-output/.nojekyll

      - name: Deploy to GitHub Pages
        if: steps.diff.outputs.success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          cp gas-report.html /tmp/deploy/
          bash scripts/shell/deploy-to-gh-pages.sh /tmp/deploy ${{ steps.path.outputs.target }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-reports
          path: |
            pr-gas-report.txt
            main-gas-report.txt
            gas-report.md
            gas-report.html
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Gas Report
          RESULT: ${{ steps.diff.outputs.result }}
          SUCCESS: ${{ steps.diff.outputs.success }}
          HAS_DETAILS: ${{ steps.diff.outputs.has_changes }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GAS_URL: ${{ steps.path.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const gasUrl = process.env.GAS_URL;
            const success = process.env.SUCCESS === 'true';
            const rawResult = process.env.RESULT || 'Failed';
            const result = success ? `${rawResult} - [View Report](${gasUrl})` : rawResult;
            const hasDetails = success && process.env.HAS_DETAILS === 'true';
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('gas-report.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};

            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';

              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }

              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            rows[section] = result;

            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full report](${gasUrl}) | [View logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Gas Report', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Gas Report', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;

            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }


            // GitHub issue/PR comments are capped at 65536 characters. As the CI
            // summary accumulates `<details>` blocks from every workflow, the body
            // occasionally trips the limit. Fall back to the summary table only;
            // each row already carries a `[View Report]` link so the per-section
            // details remain reachable without inlining them here.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit. Follow the **View Report** links above for each section's full output._`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: |
          DIR="gas/pr-${{ github.event.pull_request.number }}"
          [ -d "$DIR" ] || exit 0
          rm -rf "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up gas report for PR #${{ github.event.pull_request.number }}" || true
          git push
