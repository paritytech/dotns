name: Gas Report

# SECURITY ATTENTION
# This workflow uses `pull_request_target` for the on-close cleanup job
# only. `pull_request_target` runs in the BASE branch's workflow context
# with repository secrets and a write-scoped GITHUB_TOKEN. The cleanup
# job is gated on `github.event.action == 'closed'` and does NOT check
# out PR-head code, so no untrusted code executes under that context.
#
# The matrix `generate` shard that pulls the PR head's `patches/` runs
# under the `pull_request` trigger (not `pull_request_target`), so its
# checkout of PR-head code does not see repository secrets.
#
# Adding other `pull_request_target` event types or any step that
# checks out PR-head code under that trigger would let a malicious PR
# exfiltrate repo secrets. Re-review carefully if widened.
on:
  pull_request:
    branches: [master]
    paths: ["contracts/**", "test/**", "**.sol"]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: gas-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Gas Report (${{ matrix.target.label }})
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      # Each target runs on its own runner so the PR-branch and master-branch
      # gas reports do not have to share one machine's memory budget. The
      # aggregator job downloads both artifacts to compute the diff.
      fail-fast: false
      matrix:
        target:
          - id: pr
            label: PR branch
            ref: ""
          - id: master
            label: master branch
            ref: master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.ref }}
          submodules: recursive

      - id: foundry_toolchain
        continue-on-error: true
        uses: ./.github/actions/setup-foundry
      - name: Retry Foundry install on transient failure
        if: steps.foundry_toolchain.outcome == 'failure'
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          if [ ! -x "$HOME/.foundry/bin/foundryup" ]; then
            curl -L https://foundry.paradigm.xyz | bash
          fi
          for attempt in 1 2 3; do
            echo "Retrying Foundry nightly install (attempt $attempt/3)..."
            if "$HOME/.foundry/bin/foundryup" --install stable; then
              exit 0
            fi
            sleep 5
          done
          echo "Foundry nightly install failed after retries."
          exit 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
          no-cache: true

      # `openzeppelin-foundry-upgrades` shells out to `npx @openzeppelin/upgrades-core`
      # via `vm.ffi` during tests; bun does not provide `npx`, so install Node here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sidecar checkout of the PR head's `patches/` and apply script. The
      # master-branch matrix shard is checked out at `master`, which does not yet
      # carry the OZ payable patches needed for the registrar transferFrom
      # overrides. Sourcing them from the PR head keeps the two shards
      # building against the same vendored OZ tree. Removed once the patches
      # land on master.
      - name: Sidecar checkout for OZ patches
        if: matrix.target.id == 'master'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head-sidecar
          sparse-checkout: |
            patches
            scripts/shell/apply-oz-patches.sh
          sparse-checkout-cone-mode: false

      - name: Apply OZ patches (master shard only)
        if: matrix.target.id == 'master'
        run: |
          rm -rf patches
          cp -R pr-head-sidecar/patches ./patches
          mkdir -p scripts/shell
          cp pr-head-sidecar/scripts/shell/apply-oz-patches.sh scripts/shell/apply-oz-patches.sh
          chmod +x scripts/shell/apply-oz-patches.sh
          bash scripts/shell/apply-oz-patches.sh

      - run: bun install

      - name: Start revive-eth-rpc (paseo_local fork target)
        run: |
          docker compose up -d --build
          bash scripts/shell/wait-for-eth-rpc.sh

      - name: Generate gas report
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
          FOUNDRY_PROFILE: "gas"
        run: |
          # `rm -rf out/build-info` is load-bearing: forge test re-invokes solc
          # with a narrower outputSelection than forge build, can overwrite the
          # full build-info with a partial one, and the OZ validator (which runs
          # at test execution time via vm.ffi) then rejects it. Removing only
          # the build-info dir forces forge build to write a fresh complete one
          # while preserving the solc compilation cache under `cache/`.
          rm -rf out/build-info
          forge build
          # Skip invariant tests in the gas report: invariant runs dominate
          # the wall-clock for ~20% of the gas signal (most invariants exercise
          # the same paths the unit/fuzz suites already cost). Keep the
          # `test/fork/**` exclusion since fork tests price RPC-replayed paths
          # rather than function-level gas.
          forge test --gas-report \
            --no-match-contract Invariant \
            --no-match-path 'test/fork/**' \
            2>&1 | tee gas-report.txt

      - name: Tear down revive-eth-rpc
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Stage shard output
        if: always()
        run: |
          mkdir -p shard
          [ -f gas-report.txt ] && cp gas-report.txt "shard/${{ matrix.target.id }}-gas-report.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-shard-${{ matrix.target.id }}
          path: shard
          retention-days: 7

  report:
    name: Gas Report Diff
    needs: generate
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: gas-artifacts
          pattern: gas-shard-*

      - name: Collect shard reports
        id: collect
        run: |
          # Surface a clear failure when either shard's gas report is missing
          # so the aggregator can mark the section "Failed - shard missing"
          # rather than crashing inside `gas-report.py` with a stat() error.
          PR_REPORT="gas-artifacts/gas-shard-pr/pr-gas-report.txt"
          MAIN_REPORT="gas-artifacts/gas-shard-master/master-gas-report.txt"
          MISSING=""
          [ -f "$PR_REPORT" ] || MISSING="${MISSING} pr"
          [ -f "$MAIN_REPORT" ] || MISSING="${MISSING} master"
          if [ -n "$MISSING" ]; then
            {
              echo "missing=${MISSING}"
              echo "success=false"
              echo "result=Failed - missing shard:${MISSING}"
              echo "has_changes=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$PR_REPORT" pr-gas-report.txt
          cp "$MAIN_REPORT" master-gas-report.txt
          echo "missing=" >> "$GITHUB_OUTPUT"

      - name: Generate HTML and markdown reports
        id: diff
        if: steps.collect.outputs.missing == ''
        run: |
          if python3 scripts/reports/gas-report.py master-gas-report.txt pr-gas-report.txt; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "success=false"
              echo "result=Failed - report generation error"
              echo "has_changes=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set deploy path
        id: path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "target=gas/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER}.github.io/${REPO_NAME}/gas/pr-${PR_NUM}/gas-report.html" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy directory
        if: steps.diff.outputs.success == 'true'
        run: |
          mkdir -p gas-output
          cp gas-report.html gas-output/
          touch gas-output/.nojekyll

      - name: Deploy to GitHub Pages
        if: steps.diff.outputs.success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          cp gas-report.html /tmp/deploy/
          bash scripts/shell/deploy-to-gh-pages.sh /tmp/deploy ${{ steps.path.outputs.target }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-reports
          path: |
            pr-gas-report.txt
            master-gas-report.txt
            gas-report.md
            gas-report.html
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Gas Report
          RESULT: ${{ steps.diff.outputs.result || steps.collect.outputs.result }}
          SUCCESS: ${{ steps.diff.outputs.success }}
          HAS_DETAILS: ${{ steps.diff.outputs.has_changes }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GAS_URL: ${{ steps.path.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const gasUrl = process.env.GAS_URL;
            const success = process.env.SUCCESS === 'true';
            const rawResult = process.env.RESULT || 'Failed';
            const result = success ? `${rawResult} - [View Report](${gasUrl})` : rawResult;
            const hasDetails = success && process.env.HAS_DETAILS === 'true';
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('gas-report.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};

            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';

              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }

              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            rows[section] = result;

            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full report](${gasUrl}) | [View logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage', 'Documentation', 'Format & Lint', 'File Validation', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;

            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }

            // GitHub issue/PR comments are capped at 65536 characters. As the CI
            // summary accumulates `<details>` blocks from every workflow, the body
            // occasionally trips the limit. Fall back to the summary table only;
            // each row already carries a `[View Report]` link so the per-section
            // details remain reachable without inlining them here.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit. Follow the **View Report** links above for each section's full output._`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: |
          DIR="gas/pr-${{ github.event.pull_request.number }}"
          [ -d "$DIR" ] || exit 0
          rm -rf "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up gas report for PR #${{ github.event.pull_request.number }}" || true
          git push
