name: Issue Auto-Label

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  label:
    if: ${{ !contains(github.event.issue.labels.*.name, 'whitelist-request') }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract labels from form body
        id: extract
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          labels=""

          comp="$(printf '%s\n' "$BODY" | awk '/^### Component/{getline; while(/^[[:space:]]*$/)getline; print}' | tr -d '\r' | xargs)"
          case "$comp" in
            "Registration")                      labels="scope: registration" ;;
            "Resolver")                          labels="scope: resolver" ;;
            "Store")                             labels="scope: store" ;;
            "Proof of Personhood"|"PoP")         labels="scope: pop" ;;
            "Other"|"")                          ;;
          esac

          priority="$(printf '%s\n' "$BODY" | awk '/^### Priority/{getline; while(/^[[:space:]]*$/)getline; print}' | tr -d '\r' | xargs)"
          case "$priority" in
            "P0")  [ -n "$labels" ] && labels="$labels,P0" || labels="P0" ;;
            "P1")  [ -n "$labels" ] && labels="$labels,P1" || labels="P1" ;;
            "P2")  [ -n "$labels" ] && labels="$labels,P2" || labels="P2" ;;
            "")    ;;
            *)     [ -n "$labels" ] && labels="$labels,P3" || labels="P3" ;;
          esac

          {
            echo "labels=$labels"
            echo "component=$comp"
            echo "priority=$priority"
          } >> "$GITHUB_OUTPUT"

      - name: Apply labels
        if: steps.extract.outputs.labels != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ steps.extract.outputs.labels }}
        run: |
          IFS=',' read -ra LABEL_ARRAY <<< "$LABELS"
          JSON="["
          first=true
          for label in "${LABEL_ARRAY[@]}"; do
            if [ "$first" = true ]; then
              first=false
            else
              JSON+=","
            fi
            JSON+="\"$label\""
          done
          JSON+="]"

          gh api \
            repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels \
            --input - <<< "{\"labels\":$JSON}"

      - name: Apply default triage label when no labels extracted
        if: steps.extract.outputs.labels == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels \
            --input - <<< '{"labels":["triage"]}'

          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -f body='No component or priority detected — tagged as **triage**. Please update the issue with a Component and Priority so it can be labeled correctly.'