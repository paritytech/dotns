name: Publish Beta Package

# Creating a `v*` tag is restricted to the dotns team by the `release tags` ruleset, and the
# job below pauses on the `releases` environment for a reviewer, so a release takes two
# distinct human actions: cutting the tag, and approving the run it starts.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release version, e.g. v0.5.5-rc1. The tag is created from the selected branch."
        required: true
        type: string

permissions:
  contents: write

# Two runs for the same version would race to attach assets to the same draft. On a
# dispatch `github.ref_name` is the branch, so key on the requested version instead.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  beta-release:
    runs-on: ubuntu-latest
    # Gated: this job reads the genesis owner key, which lives only on the `releases`
    # environment, so every run waits for a reviewer's approval there.
    environment: releases
    # One genesis per TLD, since the TLD is baked into the registry: `.testnet` for previewnet,
    # `.paseo` for Paseo Asset Hub Next V2. Job-level: several steps name the files it yields.
    env:
      DOTNS_TLDS: testnet paseo
    steps:
      # On workflow_dispatch the tag does not exist yet; the release step creates it
      # from the branch this run was started on. Read through an env var rather than
      # interpolating the input into the script.
      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # The suffix is restricted to characters GitHub keeps verbatim in an asset
          # name; a space, for instance, is rewritten to a dot and would fail the
          # asset check after a full build. Segmented like run.sh's semver check
          # (dot-separated, non-empty identifiers), so no tag can be published
          # here that the deploy pipeline would then refuse.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "::error::Pre-release version must look like v1.2.3-rc1, got '$TAG'."
            exit 1
          fi
          # A release created for an existing tag is cut at that tag's commit: GitHub
          # ignores target_commitish when the tag is already there. The ABIs would come
          # from this branch while the release pointed somewhere else.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; use a different version."
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG from $GITHUB_REF_NAME."

      - name: Reject a pre-published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          if state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/gh-err.txt"); then
            if [ "$state" = "false" ]; then
              echo "::error::Pre-release $TAG is already published; use a different version."
              exit 1
            fi
            echo "$TAG exists as a draft; assets can still be attached."
          elif grep -qi "release not found" "$RUNNER_TEMP/gh-err.txt"; then
            echo "No release for $TAG yet."
          else
            echo "::error::Could not read the state of release $TAG; refusing to continue."
            cat "$RUNNER_TEMP/gh-err.txt"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry

      # The environment pairs the key (secret) with its address (variable). Deriving one from
      # the other before the build turns a mistyped key into a failed run instead of a genesis
      # owned by an address nobody holds. The address is public; the key is never printed.
      - name: Check the owner key against its declared address
        env:
          DOTNS_ADMIN_KEY: ${{ secrets.DOTNS_ADMIN_KEY }}
          DOTNS_ADMIN_ADDRESS: ${{ vars.DOTNS_ADMIN_ADDRESS }}
        run: |
          set -euo pipefail
          if [ -z "$DOTNS_ADMIN_KEY" ]; then
            echo "::error::DOTNS_ADMIN_KEY is not configured on the releases environment"
            exit 1
          fi
          if [ -z "$DOTNS_ADMIN_ADDRESS" ]; then
            echo "::error::DOTNS_ADMIN_ADDRESS is not configured on the releases environment"
            exit 1
          fi
          DERIVED="$(cast wallet address --private-key "$DOTNS_ADMIN_KEY")"
          if [ "$(printf '%s' "$DERIVED" | tr 'A-Z' 'a-z')" != "$(printf '%s' "$DOTNS_ADMIN_ADDRESS" | tr 'A-Z' 'a-z')" ]; then
            echo "::error::DOTNS_ADMIN_KEY derives to $DERIVED, the environment declares $DOTNS_ADMIN_ADDRESS"
            exit 1
          fi
          echo "Owner key derives to the declared address $DERIVED"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
          no-cache: true

      # `openzeppelin-foundry-upgrades` shells out to `npx @openzeppelin/upgrades-core`
      # via `vm.ffi` during tests; bun does not provide `npx`, so install Node here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: bun install

      - name: Build contracts
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        # Remove any prior build-info so the OZ validator (vm.ffi inside
        # upgrade tests in the next step) reads the complete artefact this
        # build emits. Preserving `cache/` keeps incremental compile fast.
        run: rm -rf out/build-info && forge build --sizes

      - name: Run tests
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge test -vv

      # pallet-revive genesis, built from the code this tag ships. Unlike deployments.json
      # below — which is withheld from a pre-release because it records a *previous* live
      # deployment of different code — this genesis is a fresh deploy of exactly this commit,
      # so its addresses and its ABIs do come from the same release.
      #
      # Present on pre-releases as well as releases so the asset sets do not diverge, and so
      # this step is exercised before a real release depends on it.
      - name: Build pallet-revive genesis
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
          FACTORY_DEPLOYER_KEY: ${{ secrets.FACTORY_DEPLOYER_KEY }}
          DOTNS_ADMIN_KEY: ${{ secrets.DOTNS_ADMIN_KEY }}
        run: |
          for tld in $DOTNS_TLDS; do
            DOTNS_TLD="$tld" bash scripts/genesis/build-genesis.sh release
          done

      - name: Extract ABIs
        run: |
          mkdir -p release/abis

          # read trims stray spaces and tabs on its own. A carriage return, from a list
          # saved with CRLF line endings, it does not: that would end up inside the
          # artifact path below, so strip it explicitly.
          while read -r name || [ -n "$name" ]; do
            name="${name%$'\r'}"
            case "$name" in '' | '#'*) continue ;; esac
            abi_file="out/${name}.sol/${name}.json"
            if [ ! -f "$abi_file" ]; then
              echo "::error::${abi_file} not found; check .github/abi-contracts.txt"
              exit 1
            fi
            jq '.abi' "$abi_file" > "release/abis/${name}.json"
            echo "Extracted ${name}"
          done < .github/abi-contracts.txt

          # Record what the build actually produced, so the post-upload check compares
          # against it rather than against a second hand-maintained list.
          find release/abis -maxdepth 1 -type f -printf '%f\n' | sort > release/expected-assets.txt
          echo "Extracted $(wc -l < release/expected-assets.txt) ABIs"

      # No addresses: a pre-release is cut to be deployed, so the recorded addresses still
      # belong to the previous deployment of different code. Publishing them under this tag
      # would break the promise that a release's addresses and ABIs come from the same release.
      - name: Generate release manifest
        run: |
          bun scripts/js/release-metadata.mjs build --tag "$RELEASE_TAG" --out release \
            --addresses false

      - name: Package pre-release artifacts
        run: |
          TAG="$RELEASE_TAG"
          cd release
          zip -r "../dotns-abis-${TAG}.zip" abis/ release-manifest.json codehashes.json \
            dotns-genesis-*.json

      - name: Generate release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          ASSET_BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"

          cat > release-body.md << 'ENDOFBODY'
          ## DotNS ABI Package (Pre-release)

          > **This is a pre-release.** ABIs may change before the stable release.

          **Contracts**
          | Contract | ABI |
          |----------|-----|
          ENDOFBODY

          for f in release/abis/*.json; do
            name=$(basename "$f" .json)
            echo "          | \`${name}\` | [${name}.json]($ASSET_BASE/${name}.json) |" >> release-body.md
          done

          cat >> release-body.md << 'ENDOFBODY'

          ### Download

          - **All ABIs (zip):** [dotns-abis-${TAG}.zip](${ASSET_BASE}/dotns-abis-${TAG}.zip)
          - **Individual ABIs:** Each contract ABI is also attached as a separate artifact

          ### Usage

          ```ts
          import StoreAbi from "./abis/Store.json";
          import RegistrarAbi from "./abis/DotnsRegistrar.json";
          ```
          ENDOFBODY

          sed -i 's/^          //' release-body.md
          # The heredocs above are quoted so the ```ts fence is not treated as command
          # substitution, which also leaves ${TAG} unexpanded. Substitute it here.
          sed -i "s|\${ASSET_BASE}|$ASSET_BASE|g; s|\${TAG}|$TAG|g" release-body.md

          {
            echo ""
            echo "### Deployments"
            echo ""
            echo "No **live** addresses are published with a pre-release: this code is not"
            echo "deployed yet, so there is no deployment to record. Deploy this tag, then cut"
            echo "the release, which carries the addresses it produced."
            echo ""
            echo "The genesis attached here is different: it is built by deploying this very"
            echo "commit to a throwaway chain, so it carries **this commit's own addresses**,"
            echo "not the previous live deployment's."
            echo ""
            echo "- **Release contents:** [release-manifest.json]($ASSET_BASE/release-manifest.json)"
            for tld in $DOTNS_TLDS; do
              echo "- [dotns-genesis-${tld}.json]($ASSET_BASE/dotns-genesis-${tld}.json) - pallet-revive genesis, \`.${tld}\` TLD, for .${tld} networks only."
            done
          } >> release-body.md

      - name: ABI diff since previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The previous published release's ABIs come from its zip; diffing against them
          # announces every selector change in the body, most importantly a same-name
          # signature change, which an old caller experiences as a bare revert. A previous
          # release without the zip degrades to "no diff" rather than failing the release.
          PREV=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          prev_args=()
          if [ -n "$PREV" ] && gh release download "$PREV" --repo "$GITHUB_REPOSITORY" \
            --pattern 'dotns-abis-*.zip' --dir prev-abis >/dev/null 2>&1; then
            unzip -q -o prev-abis/dotns-abis-*.zip -d prev-abis
            prev_args=(--previous prev-abis/abis --previous-tag "$PREV")
          fi
          bun scripts/js/release-metadata.mjs abidiff --current release/abis \
            "${prev_args[@]}" --json release/abi-diff.json >> release-body.md

      - name: Create draft pre-release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          # Explicit because on workflow_dispatch there is no tag to infer; the action
          # creates it at this run's commit.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dotns-abis-*.zip
            release/abis/*.json
            release/release-manifest.json
            release/codehashes.json
            release/abi-diff.json
            release/dotns-genesis-*.json
          body_path: release-body.md
          draft: true
          prerelease: true
          generate_release_notes: true

      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG="$RELEASE_TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort > "$RUNNER_TEMP/actual-assets.txt"
          { cat release/expected-assets.txt
            echo "dotns-abis-${TAG}.zip"
            echo "release-manifest.json"
            echo "codehashes.json"
            echo "abi-diff.json"
            for tld in $DOTNS_TLDS; do echo "dotns-genesis-${tld}.json"; done
          } | sort > "$RUNNER_TEMP/wanted-assets.txt"
          if ! diff -u "$RUNNER_TEMP/wanted-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "::error::Draft pre-release $TAG does not match the expected asset set; delete the draft and re-run."
            exit 1
          fi
          echo "Verified $(wc -l < "$RUNNER_TEMP/wanted-assets.txt") assets on draft $TAG."

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published $TAG with its complete asset set."
