name: Coverage

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'contracts/**', 'test/**', '**.sol']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"

      - run: bun install

      - name: Build contracts first
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge build

      - name: Run coverage
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          
          # Try to run coverage - some projects may have tests that use vm.readFile
          # which doesn't work with forge coverage's instrumented recompile
          forge coverage --ir-minimum --report summary \
            --no-match-coverage "test/|lib/" \
            2>&1 | tee coverage.log
          CODE=$?

          python3 << 'EOF'
          import re
          import os

          out = lambda k,v: open(os.environ['GITHUB_OUTPUT'], 'a').write(f"{k}={v}\n")

          with open('coverage.log', 'r') as f:
              content = f.read()

          # Check for vm.readFile failures (common issue with forge coverage)
          if 'vm.readFile' in content and 'No such file or directory' in content:
              out('result', 'Skipped - Tests use vm.readFile (incompatible with coverage)')
              out('has_details', 'false')
              exit(0)
          
          # Check for other test failures
          if 'Failing tests:' in content:
              fail_match = re.search(r'Encountered a total of (\d+) failing test', content)
              if fail_match:
                  out('result', f'Tests failed - Cannot compute coverage')
                  out('has_details', 'false')
                  exit(0)

          # Parse coverage summary
          # Format: | contracts/file.sol | 85.00% (x/y) | 80.00% (x/y) | ...
          files = []
          total_line = None
          
          for line in content.split('\n'):
              # Match file rows with percentage and fraction format
              match = re.match(r'\|\s*([^\|]+\.sol)\s*\|\s*([\d.]+)%\s*\(\d+/\d+\)\s*\|\s*([\d.]+)%\s*\(\d+/\d+\)\s*\|\s*([\d.]+)%\s*\(\d+/\d+\)\s*\|\s*([\d.]+)%', line)
              if match:
                  name = match.group(1).strip()
                  # Skip test files and lib files
                  if not name.startswith('test/') and not name.startswith('lib/'):
                      files.append({
                          'name': name,
                          'lines': float(match.group(2)),
                          'statements': float(match.group(3)),
                          'branches': float(match.group(4)),
                          'funcs': float(match.group(5))
                      })
              
              # Match total row
              total_match = re.match(r'\|\s*Total\s*\|\s*([\d.]+)%', line)
              if total_match:
                  total_line = float(total_match.group(1))

          if not files and total_line is None:
              # Try alternative format
              for line in content.split('\n'):
                  alt_match = re.search(r'(\d+\.\d+)%.*lines', line, re.IGNORECASE)
                  if alt_match:
                      total_line = float(alt_match.group(1))
                      break

          if files or total_line is not None:
              if total_line is None and files:
                  total_line = sum(f['lines'] for f in files) / len(files) if files else 0
              
              out('result', f'{total_line:.1f}% line coverage')
              out('has_details', 'true' if files else 'false')
          else:
              out('result', 'Coverage completed')
              out('has_details', 'false')

          # Build details markdown
          md = []
          if files:
              md.append("\n| File | Lines | Statements | Branches | Functions |")
              md.append("|:-----|------:|-----------:|---------:|----------:|")
              
              # Sort by coverage (lowest first to highlight areas needing work)
              for f in sorted(files, key=lambda x: x['lines']):
                  name = f['name']
                  if len(name) > 50:
                      name = '...' + name[-47:]
                  md.append(f"| {name} | {f['lines']:.1f}% | {f['statements']:.1f}% | {f['branches']:.1f}% | {f['funcs']:.1f}% |")

          with open('coverage-details.md', 'w') as f:
              f.write('\n'.join(md))
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.log
            coverage-details.md
          retention-days: 7

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Coverage
          RESULT: ${{ steps.run.outputs.result }}
          HAS_DETAILS: ${{ steps.run.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('coverage-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};
            
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';
              
              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }
              
              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            rows[section] = result;

            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full report](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;
            
            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }