name: Coverage

# SECURITY ATTENTION
# This workflow uses `pull_request_target` for the on-close cleanup job
# only. `pull_request_target` runs in the BASE branch's workflow context
# with repository secrets and a write-scoped GITHUB_TOKEN. The cleanup
# job is gated on `github.event.action == 'closed'` and does NOT check
# out PR-head code, so no untrusted code executes under that context.
#
# Adding other `pull_request_target` event types or any step that
# checks out PR-head code under that trigger would let a malicious PR
# exfiltrate repo secrets. Re-review carefully if widened.
on:
  pull_request:
    branches: [master]
    paths: ['contracts/**', 'test/**', '**.sol']
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
          no-cache: true

      # `openzeppelin-foundry-upgrades` shells out to `npx @openzeppelin/upgrades-core`
      # via `vm.ffi` during tests; bun does not provide `npx`, so install Node here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: bun install

      # `cache/` and `out/` are forge's own incremental-compile state: it hashes each
      # source file and only recompiles what changed since the hash it last saw. A
      # restored cache from an unrelated commit is always safe to build on top of.
      # Forge just recompiles whatever the content hashes say is dirty, so a partial
      # match via `restore-keys` still saves most of a cold `via_ir` build. This has
      # to sit after `bun install`: its postinstall (`setup.bash`) force-reclones
      # `lib/`'s pinned dependencies and reapplies the OZ patches on top, so hashing
      # `lib/` any earlier would key the cache off content these steps are about to
      # replace.
      #
      # Forge also drops persisted fuzz/invariant/test failure state under
      # `cache/fuzz`, `cache/invariant`, and `cache/test-failures`, and replays it
      # on the next run before exploring anything new (see foundry.toml's
      # `[profile.ci.invariant]` comment). That state is cleared below, both before
      # this job's `forge coverage` run and again right before the job ends, so it
      # never rides along in what gets restored or saved here.
      - uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-build-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'contracts/**/*.sol', 'test/**/*.sol', 'scripts/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: |
            foundry-build-${{ runner.os }}-

      - name: Build contracts
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        # Remove any prior build-info so this `forge build` writes the only
        # JSON in `out/build-info/`; the OZ validator (vm.ffi inside upgrade
        # tests) requires a complete-compilation artefact. Note: `forge
        # coverage --ir-minimum` in the next step recompiles via the IR
        # pipeline and may emit its own build-info mid-run; if the validator
        # ever fires inside coverage runs we'll need a tighter mitigation
        # (e.g. excluding upgrade tests from coverage).
        run: rm -rf out/build-info && forge build

      - name: Run coverage
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e

          # A restored cache can carry a fuzz/invariant/test failure persisted by
          # an earlier, unrelated run. Forge replays those before running anything
          # new, so a stale one would fail this job even after the real bug behind
          # it was fixed. Clear it before running coverage.
          rm -rf cache/fuzz cache/invariant cache/test-failures

          forge coverage --ir-minimum --report summary \
            --no-match-coverage "test/|lib/" \
            2>&1 | tee coverage.log
          CODE=${PIPESTATUS[0]}

          python3 scripts/reports/coverage-report.py coverage.log
          exit $CODE

      - name: Set deploy path
        id: path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "target=coverage/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER}.github.io/${REPO_NAME}/coverage/pr-${PR_NUM}/coverage-report.html" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy directory
        if: steps.run.outputs.has_details == 'true'
        run: |
          mkdir -p coverage-output
          cp coverage-report.html coverage-output/
          touch coverage-output/.nojekyll

      - name: Deploy to GitHub Pages
        if: steps.run.outputs.has_details == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          cp coverage-report.html /tmp/deploy/
          bash scripts/shell/deploy-to-gh-pages.sh /tmp/deploy ${{ steps.path.outputs.target }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.log
            coverage-details.md
            coverage-report.html
          retention-days: 7

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Coverage
          RESULT: ${{ steps.run.outputs.result }}
          HAS_DETAILS: ${{ steps.run.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          COVERAGE_URL: ${{ steps.path.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const coverageUrl = process.env.COVERAGE_URL;
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const rawResult = process.env.RESULT || 'Failed';
            const result = hasDetails ? `${rawResult} - [View Report](${coverageUrl})` : rawResult;
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('coverage-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};

            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';

              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }

              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            rows[section] = result;

            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full report](${coverageUrl}) | [View logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage', 'Documentation', 'Format & Lint', 'File Validation', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;

            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }


            // GitHub issue/PR comments are capped at 65536 characters. As the CI
            // summary accumulates `<details>` blocks from every workflow, the body
            // occasionally trips the limit. Fall back to the summary table only;
            // each row already carries a `[View Report]` link so the per-section
            // details remain reachable without inlining them here.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit. Follow the **View Report** links above for each section's full output._`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Last step in the job on purpose: `actions/cache`'s save only runs once
      # every step above has finished, and it caches whatever is on disk at that
      # point, not just what "Run coverage" left behind. Clearing here too means
      # nothing this job did can leave a persisted failure in the saved cache.
      - name: Clear persisted Foundry failure state before cache save
        if: always()
        run: rm -rf cache/fuzz cache/invariant cache/test-failures

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: |
          DIR="coverage/pr-${{ github.event.pull_request.number }}"
          [ -d "$DIR" ] || exit 0
          rm -rf "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up coverage report for PR #${{ github.event.pull_request.number }}" || true
          git push
