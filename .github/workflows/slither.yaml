name: Slither Analysis

on:
  pull_request:
    branches: [main, develop]
    paths: ['contracts/**', 'src/**', 'foundry.toml']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge install && forge build --build-info
      - run: pip3 install slither-analyzer

      - name: Run Slither
        continue-on-error: true
        run: |
          slither . --json slither.json --filter-paths "lib/|test/" \
            --exclude-dependencies --compile-force-framework foundry || true

      - name: Process results
        id: run
        run: |
          python3 << 'EOF'
          import json, os
          from collections import defaultdict

          out = lambda k,v: open(os.environ['GITHUB_OUTPUT'], 'a').write(f"{k}={v}\n")

          if not os.path.exists('slither.json'):
              out('result', 'Failed - No report generated')
              out('total', '0')
              out('has_issues', 'false')
              exit(0)

          data = json.load(open('slither.json'))
          findings = defaultdict(list)

          for d in data.get('results', {}).get('detectors', []):
              sev = d.get('impact', 'Info').capitalize()
              loc = ''
              for e in d.get('elements', [])[:1]:
                  sm = e.get('source_mapping', {})
                  if sm.get('filename_short') and sm.get('lines'):
                      loc = f"{sm['filename_short']}:{sm['lines'][0]}"
              findings[sev].append({
                  'check': d.get('check', '?'),
                  'desc': d.get('description', '')[:100].replace('|', '-').replace('\n', ' '),
                  'loc': loc
              })

          total = sum(len(v) for v in findings.values())
          h = len(findings.get('High',[]))
          m = len(findings.get('Medium',[]))
          l = len(findings.get('Low',[]))
          i = len(findings.get('Informational',[]))

          if total == 0:
              out('result', 'Passed - No issues found')
              out('total', '0')
              out('has_issues', 'false')
          else:
              parts = []
              if h: parts.append(f'{h} high')
              if m: parts.append(f'{m} medium')
              if l: parts.append(f'{l} low')
              if i: parts.append(f'{i} info')
              out('result', f'Found {total} issues: {", ".join(parts)}')
              out('total', str(total))
              out('has_issues', 'true')

          md = []
          for sev in ['High','Medium','Low','Informational']:
              items = findings.get(sev, [])
              if not items: continue
              md.append(f"\n**{sev} ({len(items)})**\n")
              md.append("| Check | Description | Location |")
              md.append("|:------|:------------|:---------|")
              for x in items[:10]:
                  md.append(f"| {x['check']} | {x['desc']} | {x['loc']} |")
              if len(items) > 10:
                  md.append(f"| | +{len(items)-10} more | |")

          open('slither-details.md', 'w').write('\n'.join(md))
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: |
            slither.json
            slither-details.md
          retention-days: 30

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Slither Analysis
          RESULT: ${{ steps.run.outputs.result }}
          HAS_ISSUES: ${{ steps.run.outputs.has_issues }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';
            const hasIssues = process.env.HAS_ISSUES === 'true';
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('slither-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            // Parse existing data
            let rows = {};
            let existingDetails = {};
            
            if (existing?.body) {
              // Split into table and details sections
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';
              
              // Parse table rows - only match lines with exactly 2 cells after Check|Result header
              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }
              
              // Parse existing details
              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            // Update this section's row
            rows[section] = result;

            // Build table
            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            // Update details
            if (hasIssues && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full report](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            // Build details section
            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;
            
            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }