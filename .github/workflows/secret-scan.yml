name: Secret Scan

# Scans for committed secrets with Gitleaks on every pull request to master
# and every push to master. The ruleset and allowlist live in .gitleaks.toml;
# historical doc-example findings are pinned in .gitleaksignore.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  scan:
    runs-on: parity-int-ubuntu-xl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so a push to master scans the whole repository, not
          # just the tip commit. Pull requests scan the merged working tree.
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        id: scan
        run: |
          set +e
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-report.json \
            --log-level warn
          SCAN_EXIT=$?
          set -e

          if [ "$SCAN_EXIT" -eq 0 ]; then
            echo "result=Passed - No secrets detected" >> "$GITHUB_OUTPUT"
            echo "has_details=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Non-zero exit means findings (or a scanner error). Summarise the
          # findings with secrets redacted so nothing sensitive lands in logs
          # or the PR comment.
          COUNT=$(jq 'length' gitleaks-report.json 2>/dev/null || echo "?")
          {
            echo "**$COUNT potential secret(s) detected.** Values are redacted."
            echo ""
            echo "| File | Line | Rule |"
            echo "|:-----|:-----|:-----|"
            jq -r '.[] | "| `\(.File)` | \(.StartLine) | \(.RuleID) |"' \
              gitleaks-report.json 2>/dev/null | head -50
            echo ""
            echo "If a finding is a false positive (vendored code or a public "
            echo "test key), add an allowlist entry to \`.gitleaks.toml\`. For a "
            echo "historical finding already removed from the tree, pin its "
            echo "fingerprint in \`.gitleaksignore\`."
          } > secret-scan-details.md

          echo "result=Failed - $COUNT potential secret(s) detected" >> "$GITHUB_OUTPUT"
          echo "has_details=true" >> "$GITHUB_OUTPUT"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            secret-scan-details.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Secret Scan
          RESULT: ${{ steps.scan.outputs.result }}
          HAS_DETAILS: ${{ steps.scan.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try {
              details = fs.readFileSync('secret-scan-details.md', 'utf8').trim();
            } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};

            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';

              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }

              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            rows[section] = result;

            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            const order = ['Secret Scan', '4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Gas Report', 'Coverage', 'Documentation', 'Format & Lint', 'File Validation', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const detailsOrder = ['Secret Scan', '4naly3er Analysis', 'Slither Analysis', 'Contract Tests (Unit + Fuzz)', 'Contract Tests (Invariant)', 'Coverage', 'Deploy Contracts'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;

            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }

            // GitHub issue/PR comments are capped at 65536 characters. Fall back
            // to the summary table only when the cumulative body would overflow.
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              body = `${marker}\n## CI Summary\n\n${table}\n\n_Per-section details omitted: combined body exceeded the ${MAX_BODY}-char comment limit. Follow the **View Report** links above for each section's full output._`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
