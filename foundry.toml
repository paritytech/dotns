[profile.default]
src = "contracts"
out = "out"
test = "test"
script = "scripts"
libs = ["lib"]

# OZ Foundry Upgrades and deploy simulations need file access to artifacts.
# Keep broad access only if narrower permissions break upgrade validation or deployment scripts.
fs_permissions = [{ access = "read-write", path = "./" }]

# OZ Foundry Upgrades uses FFI for upgrade-safety validation.
ffi = true

ast = true
build_info = true

# Raised from Foundry's 32 MB default so the deploy script does not hit
# MemoryOOG while provisioning the full stack. Each `Upgrades.deployUUPSProxy`
# call loads the target contract's ABI JSON for OZ upgrade-safety validation;
# with ten proxies in `DotnsDeployer.run` (StoreFactory + eight protocol
# contracts + PoP controller + PoP resolver) the cumulative memory footprint
# exceeds the default cap.
memory_limit = 134217728

# Raised from Foundry's 30M default so `forge script` (and simulations via
# `forge script --rpc-url ...` without `--broadcast`) have enough gas to cover
# memory expansion when OZ validation cheatcodes return multi-MB ABI JSON
# blobs. Memory expansion gas is quadratic; 30M trips MemoryOOG long before
# any real allocation fails. 1B gives comfortable headroom.
block_gas_limit = 1000000000

optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
allow_internal_expect_revert = true

solc_version = "0.8.34"
evm_version = "cancun"

ignored_error_codes = [
    "unreachable"
]

[profile.default.optimizer_details]
yul = true

[profile.ci]
ffi = true
show_progress = true

[profile.ci.fuzz]
runs = 10000
max_test_rejects = 131072
dictionary_weight = 90
gas_report_samples = 1000
show_logs = true

[profile.ci.invariant]
runs = 1024
depth = 1000
fail_on_revert = true

# Keep normal invariant campaigns close to real EVM call behaviour.
# Use a separate targeted suite if you specifically want call override behaviour.
call_override = false

dictionary_weight = 90
shrink_run_limit = 10000
max_assume_rejects = 131072
gas_report_samples = 1000
corpus_dir = "cache/invariant/corpus"
corpus_min_mutations = 10
corpus_min_size = 1
show_edge_coverage = true
show_metrics = true
show_solidity = true
check_interval = 1

[profile.gas.fuzz]
gas_report_samples = 1000

[profile.gas.invariant]
gas_report_samples = 1000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
single_line_statement_blocks = "preserve"
multiline_func_header = "all"

[lint]
exclude_lints = ["mixed-case-variable"]

[rpc_endpoints]
paseo_local = "http://127.0.0.1:8545"
paseo = "https://services.polkadothub-rpc.com/testnet"