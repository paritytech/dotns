[profile.default]
src = "contracts"
out = "out"
test = "test"
script = "scripts"
libs = ["lib"]

fs_permissions = [{ access = "read-write", path = "./" }]

ffi = true

ast = true
build_info = true

memory_limit = 134217728
block_gas_limit = 1000000000

optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
allow_internal_expect_revert = true

solc_version = "0.8.34"
evm_version = "cancun"

ignored_error_codes = [
    "unreachable"
]

[profile.default.optimizer_details]
yul = true

[profile.ci]
ffi = true
show_progress = true

[profile.ci.fuzz]

runs = 2560
max_test_rejects = 131072
dictionary_weight = 85
gas_report_samples = 1000
show_logs = true

[profile.ci.invariant]
runs = 265
depth = 500

fail_on_revert = false

call_override = false

dictionary_weight = 85
shrink_run_limit = 10000
max_assume_rejects = 131072
gas_report_samples = 1000
show_edge_coverage = true
show_metrics = true
show_solidity = true
check_interval = 1

[profile.gas.fuzz]
gas_report_samples = 512

[profile.gas.invariant]
gas_report_samples = 512

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
single_line_statement_blocks = "preserve"
multiline_func_header = "all"

[lint]
exclude_lints = ["mixed-case-variable"]

[rpc_endpoints]
paseo_local = "http://127.0.0.1:8545"
paseo = "https://services.polkadothub-rpc.com/testnet"